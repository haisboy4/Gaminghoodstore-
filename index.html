<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Gaming Hood Store</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
  padding: 10px;
}


/* =========================================================
   HEADING
========================================================= */

.heading {
  text-align: center;
  font-size: 26px;
  font-weight: bold;
  margin: 10px auto 5px;
  color: #2196F3;
  white-space: nowrap;
  overflow: hidden;
  width: fit-content;
  cursor: pointer;
  user-select: none;
  transition: transform 0.15s, opacity 0.15s;
}

.heading:active {
  transform: scale(0.96);
  opacity: 0.75;
}

.cursor {
  display: inline-block;
  margin-left: 2px;
  animation: blink 0.7s infinite;
}

@keyframes blink {
  50% {
    opacity: 0;
  }
}


/* =========================================================
   SEARCH
========================================================= */

.search-bar {
  position: sticky;
  top: 0;
  z-index: 100;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 10px;

  background: rgba(255,255,255,0.25);

  backdrop-filter: blur(10px);

  border-radius: 20px;

  margin-bottom: 10px;

  box-shadow:
    0 4px 15px rgba(0,0,0,0.1);
}

.search-bar input {
  width: 70%;

  padding: 10px 14px;

  font-size: 16px;

  border: none;

  border-radius: 25px 0 0 25px;

  outline: none;

  background: rgba(255,255,255,0.7);
}

.search-bar button {
  background: #2196F3;

  border: none;

  color: white;

  padding: 10px 15px;

  border-radius: 0 25px 25px 0;

  cursor: pointer;

  font-size: 18px;
}

.search-bar button:hover {
  background: #1976D2;
}


/* =========================================================
   GRID
========================================================= */

.grid {
  display: grid;

  grid-template-columns:
    repeat(auto-fill, minmax(160px, 1fr));

  gap: 15px;

  margin-top: 10px;
}


/* =========================================================
   CARD
========================================================= */

.card {
  background: white;

  border-radius: 10px;

  box-shadow:
    0 2px 5px rgba(0,0,0,0.2);

  overflow: hidden;

  display: flex;

  flex-direction: column;

  min-width: 0;

  transition:
    transform 0.2s,
    box-shadow 0.2s;
}

.card:hover {
  transform: translateY(-2px);

  box-shadow:
    0 5px 12px rgba(0,0,0,0.18);
}

.card img {
  width: 100%;

  height: 140px;

  object-fit: cover;

  display: block;

  background: #eee;
}

.card .info {
  padding: 10px;

  flex: 1;
}

.card h3 {
  font-size: 16px;

  margin: 0 0 8px;

  line-height: 1.25;

  word-wrap: break-word;
}

.card p {
  font-size: 13px;

  color: gray;

  margin: 0 0 10px;

  line-height: 1.4;

  word-wrap: break-word;
}


/* =========================================================
   CARD ACTIONS
========================================================= */

.card-actions {
  display: flex;
  width: 100%;
}

.card-actions .btn {
  flex: 1;

  display: flex;

  align-items: center;

  justify-content: center;

  background: #2196F3;

  color: white;

  text-align: center;

  padding: 10px;

  text-decoration: none;

  border-radius: 0;

  font-size: 16px;

  border: none;

  cursor: pointer;

  transition: background 0.2s;
}

.card-actions .btn:hover {
  background: #1976D2;
}


/* =========================================================
   SHARE
========================================================= */

.share-btn {
  flex: 0 0 52px;

  display: flex;

  align-items: center;

  justify-content: center;

  border: none;

  background: #1976D2;

  color: white;

  cursor: pointer;

  padding: 0;

  border-radius: 0 0 10px 0;
}

.share-btn:hover {
  background: #1565C0;
}

.share-btn:active {
  transform: scale(0.94);
}

.share-icon {
  width: 22px;
  height: 22px;

  fill: none;

  stroke: currentColor;

  stroke-width: 2;

  stroke-linecap: round;

  stroke-linejoin: round;
}


/* =========================================================
   REQUEST GAME BUTTON
========================================================= */

.request-game-container {
  grid-column: 1 / -1;

  width: 100%;

  display: flex;

  justify-content: center;

  margin: 5px 0 20px;
}

.request-game-btn {
  width: 100%;

  max-width: 500px;

  min-height: 48px;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 10px;

  padding: 13px 20px;

  background: #2196F3;

  color: white;

  text-decoration: none;

  border-radius: 12px;

  font-size: 15px;

  font-weight: bold;

  box-shadow:
    0 4px 12px rgba(33,150,243,0.20);

  transition:
    transform 0.15s,
    background 0.2s,
    box-shadow 0.2s;
}

.request-game-btn:hover {
  background: #1976D2;

  box-shadow:
    0 6px 16px rgba(33,150,243,0.25);
}

.request-game-btn:active {
  transform: scale(0.97);
}

.request-game-icon {
  width: 20px;

  height: 20px;

  fill: none;

  stroke: currentColor;

  stroke-width: 2;

  stroke-linecap: round;

  stroke-linejoin: round;

  flex-shrink: 0;
}


/* =========================================================
   BACK HOME
========================================================= */

#backHome {
  display: none;

  width: 100%;

  max-width: 360px;

  margin: 18px auto 8px;

  padding: 11px 18px;

  border: 1px solid #dceaf7;

  border-radius: 25px;

  background: rgba(255,255,255,0.75);

  backdrop-filter: blur(8px);

  color: #2196F3;

  font-size: 14px;

  font-weight: bold;

  cursor: pointer;

  box-shadow:
    0 3px 12px rgba(33,150,243,0.10);
}

#backHome:active {
  transform: scale(0.97);
}


/* =========================================================
   DOWNLOAD OVERLAY
========================================================= */

.download-overlay {
  position: fixed;

  inset: 0;

  background: rgba(0,0,0,0.55);

  backdrop-filter: blur(5px);

  display: none;

  align-items: center;

  justify-content: center;

  padding: 15px;

  z-index: 1000;
}


/* =========================================================
   MODAL
========================================================= */

.download-modal {
  width: 100%;

  max-width: 500px;

  max-height: 85vh;

  overflow-y: auto;

  background: white;

  border-radius: 18px;

  box-shadow:
    0 15px 50px rgba(0,0,0,0.3);

  animation: modalIn 0.2s ease-out;
}

@keyframes modalIn {

  from {

    transform:

      scale(0.97);
  }

  to {
    opacity: 1;

    transform:

.modal-subtitle {

}

.close-modal {

  cursor: pointer;

  align-items: center;

}

.close-modal:hover {

}

.close-icon {
  width: 20px;

  height: 20px;

  fill: none;

  stroke: currentColor;

  stroke-width: 2;

  stroke-linecap: round;
}


/* =========================================================

========================================================= */

.modal-body {

/* =========================================================

.file-item:last-child {

/* =========================================================

/* =========================================================

/* =========================================================

/* =========================================================

/* =========================================================

/* =========================================================

  color: white;

  border-radius: 8px;

  cursor: pointer;

/* =========================================================

========================================================= */

.no-results {

  font-size: 16px;

/* =========================================================
   SKELETON
========================================================= */

}

.skeleton-text {

}

@keyframes shimmer {

  0% {
    background-position: -200% 0;
  }

  100% {

<script>

/* =========================================================
   TYPING HEADING
========================================================= */

const headingText =
  "Gaming Hood Store";

let typeIndex = 0;

let isDeleting = false;


function typeLoop() {

  const el =
    document.getElementById(
      "typingText"
    );


  if (!isDeleting) {

    el.textContent =
      headingText.substring(
        0,
        typeIndex++
      );


    if (
      typeIndex >
      headingText.length
    ) {

      isDeleting = true;

      setTimeout(
        typeLoop,
        5000
      );

      return;

    }

  }

  else {

    el.textContent =
      headingText.substring(
        0,
        typeIndex--
      );


    if (
      typeIndex < 0
    ) {

      isDeleting = false;

    }

  }


  setTimeout(
    typeLoop,
    isDeleting ? 50 : 100
  );

}


typeLoop();

/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(csv) {

  const rows = [];

  let row = [];

  let value = "";

  let insideQuotes = false;


  for (
    let i = 0;
    i < csv.length;
    i++
  ) {

    const char =
      csv[i];

    const next =
      csv[i + 1];


    if (
      char === '"' &&
      insideQuotes &&
      next === '"'
    ) {

      value += '"';

      i++;

    }

    else if (
      char === '"'
    ) {

      insideQuotes =
        !insideQuotes;

    }

    else if (
      char === "," &&
      !insideQuotes
    ) {

      row.push(
        value.trim()
      );

      value = "";

    }

    else if (
      (
        char === "\n" ||
        char === "\r"
      ) &&
      !insideQuotes
    ) {

      if (
        char === "\r" &&
        next === "\n"
      ) {

        i++;

      }


      row.push(
        value.trim()
      );

      value = "";


      if (
        row.some(
          cell =>
            String(
              cell ?? ""
            ).trim() !== ""
        )
      ) {

        rows.push(row);

      }


      row = [];

    }

    else {

      value += char;

    }

  }


  if (
    value !== "" ||
    row.length > 0
  ) {

    row.push(
      value.trim()
    );


    if (
      row.some(
        cell =>
          String(
            cell ?? ""
          ).trim() !== ""
      )
    ) {

      rows.push(row);

    }

  }


  return rows;

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value) {

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================================
   NORMALIZE TEXT
========================================================= */

function normalizeText(value) {

  return String(
    value ?? ""
  )

  .trim()

  .replace(
    /\s+/g,
    " "
  )

  .toLowerCase();

}

    const response =

        url,
        {
          signal:
            controller.signal,

          cache:
            "no-store"
        }
      );


    clearTimeout(
      timeout
    );


    if (
      !response.ok
    ) {

      throw new Error(
        "Files HTTP " +
        response.status
      );

    }


    csv =
      await response.text();


    console.log(
      "Files CSV export succeeded."
    );

  }

  catch(error) {

    console.warn(
      "Primary Files request failed:",
      error
    );

  }


  /* =======================================================
     BACKUP GVIZ REQUEST
  ======================================================= */

  if (
    !csv.trim()
  ) {

    try {

      const controller =
        new AbortController();


      const timeout =
        setTimeout(
          () => controller.abort(),
          10000
        );


      const url =
        filesBackupUrl +
        "&cache=" +
        Date.now();


      console.log(
        "Trying backup Files URL:",
        url
      );


      const response =
        await fetch(
          url,
          {
            signal:
              controller.signal,

            cache:
              "no-store"
          }
        );


      clearTimeout(
        timeout
      );


      if (
        !response.ok
      ) {

        throw new Error(
          "Backup Files HTTP " +
          response.status
        );

      }


      csv =
        await response.text();


      console.log(
        "Backup Files request succeeded."
      );

    }

    catch(error) {

      console.error(
        "FILES SHEET FAILED:",
        error
      );

      allFiles = [];

      return;

    }

  }


  /* =======================================================
     PARSE FILES CSV
  ======================================================= */

  console.log(
    "RAW FILES CSV:",
    csv
  );


  const rows =
    parseCSV(csv);


  if (
    !rows.length
  ) {

    console.error(
      "Files sheet returned no rows."
    );

    allFiles = [];

    return;

  }


  console.log(
    "FILES ROWS:",
    rows
  );


  /* =======================================================
     FILES SHEET HEADER
  ======================================================= */

  const headers =
    rows[0].map(
      header =>
        normalizeText(header)
    );


  console.log(
    "FILES HEADERS:",
    headers
  );


  /*
     IMPORTANT:

     Two columns are named Name.

     A = GAME NAME
     C = FILE NAME
  */


  const GAME_COLUMN = 0;

  const TYPE_COLUMN = 1;

  const FILE_NAME_COLUMN = 2;

  const SIZE_COLUMN = 3;

  const DESCRIPTION_COLUMN = 4;

  const LINK_COLUMN = 5;


  if (
    rows[0].length < 6
  ) {

    console.error(
      "Files sheet must contain at least 6 columns."
    );

    allFiles = [];

    return;

  }


  rows.shift();


  let lastGameName = "";


  allFiles = [];


  /* =======================================================
     PROCESS EVERY FILE ROW
========================================================= */

  rows.forEach(
    (row, index) => {

      if (
        !row
      ) {

        return;

      }


      const hasContent =
        row.some(
          cell =>
            String(
              cell ?? ""
            ).trim() !== ""
        );


      if (
        !hasContent
      ) {

        return;

      }


      const currentGame =
        String(
          row[GAME_COLUMN] ?? ""
        ).trim();


      if (
        currentGame
      ) {

        lastGameName =
          currentGame;

      }


      if (
        !lastGameName
      ) {

        console.warn(
          "Skipping Files row:",
          index + 2
        );

        return;

      }


      const file = {

        game:
          lastGameName,

        type:
          String(
            row[TYPE_COLUMN] ?? ""
          ).trim(),

        name:
          String(
            row[FILE_NAME_COLUMN] ?? ""
          ).trim(),

        size:
          String(
            row[SIZE_COLUMN] ?? ""
          ).trim(),

        description:
          String(
            row[DESCRIPTION_COLUMN] ?? ""
          ).trim(),

        link:
          String(
            row[LINK_COLUMN] ?? ""
          ).trim()

      };


      if (
        !file.type
      ) {

        file.type =
          "File";

      }


      if (
        !file.name
      ) {

        file.name =
          "Download";

      }


      if (
        file.link
      ) {

        allFiles.push(
          file
        );

      }


      console.log(
        "FILES ROW:",
        file
      );

    }
  );


  console.log(
    "================================"
  );

  console.log(
    "TOTAL FILES LOADED:",
    allFiles.length
  );

  console.log(
    "ALL FILE DATA:",
    allFiles
  );

  console.log(
    "================================"
  );

}

async function fetchData() {

  const loader =
    document.getElementById(
      "loader"
    );


  const retryBtn =
    document.getElementById(
      "retryBtn"
    );


  loader.style.display =
    "block";


  retryBtn.style.display =
    "none";


  showSkeletons();


  try {

    const controller =
      new AbortController();


    const timeout =
      setTimeout(
        () => controller.abort(),
        10000
      );


    const url =
      sheetUrl +
      "&cache=" +
      Date.now();


    const response =
      await fetch(
        url,
        {
          signal:
            controller.signal,

          cache:
            "no-store"
        }
      );


    clearTimeout(
      timeout
    );


    if (
      !response.ok
    ) {

      throw new Error(
        "Games HTTP error: " +
        response.status
      );

    }


    const csv =
      await response.text();


    const rows =
      parseCSV(csv);


    if (
      !rows.length
    ) {

      throw new Error(
        "Games sheet is empty."
      );

    }


    rows.shift();


    /*
       MAIN SHEET:

       A = Name
       B = Platform
       C = Image
       D = Link
       E = info

       IMPORTANT:

       Google Sheets is read from
       top to bottom.

       .reverse() flips the order
       so the LAST row becomes
       the FIRST game displayed.
    */

    allGames =
      rows

      .filter(
        row =>
          row.length >= 4
      )

      .map(
        row => ({

          name:
            String(
              row[0] || ""
            ).trim(),

          Platform:
            String(
              row[1] || ""
            ).trim(),

          image:
            String(
              row[2] || ""
            ).trim(),

          link:
            String(
              row[3] || ""
            ).trim(),

          info:
            String(
              row[4] || ""
            ).trim()

        })
      )

      .filter(
        game =>
          game.name !== ""
      )

      /*
         ==============================================
         LATEST GAME FIRST
         ==============================================

         Example:

         Sheet:
         Game A
         Game B
         Game C
         Game D

         Website:
         Game D
         Game C
         Game B
         Game A
      */
      .reverse();


    console.log(
      "================================"
    );

    console.log(
      "GAMES LOADED:",
      allGames.length
    );

    console.log(
      "LATEST GAME:",
      allGames.length
        ? allGames[0].name
        : "None"
    );

    console.log(
      allGames
    );

    console.log(
      "================================"
    );


    await loadFilesSheet();


    retries = 0;


    loader.style.display =
      "none";


    displayGames(
      allGames
    );


    openSharedGame();

  }


  catch(error) {

    console.error(
      "GAMES LOADING ERROR:",
      error
    );


    retries++;


    if (
      retries < 3
    ) {

      setTimeout(
        fetchData,
        1500
      );

    }

    else {

      loader.style.display =
        "none";


      retryBtn.style.display =
        "block";


      document.getElementById(
        "grid"
      ).innerHTML = `

        <div class="no-results">

          Unable to load games.

          <br><br>

          Please check your internet
          connection and try again.

        </div>

      `;

    }

  }

}

/* =========================================================

========================================================= */

function openDownloadPopup(
  gameName
) {

  const game =
    allGames.find(
      g =>
        normalizeText(
          g.name
        ) ===
        normalizeText(
          gameName
        )
    );


  if (
    !game
  ) {

    return;

  }


  const overlay =
    document.getElementById(
      "downloadOverlay"
    );


  const title =
    document.getElementById(
      "modalGameTitle"
    );


  const subtitle =
    document.getElementById(
      "modalGameSubtitle"
    );


  const fileList =
    document.getElementById(
      "fileList"
    );


  title.textContent =
    game.name;


  subtitle.textContent =
    game.Platform
      ? "Platform: " +
        game.Platform
      : "Files & Downloads";


  const normalizedGame =
    normalizeText(
      game.name
    );


  /*
     Match Files sheet rows.
  */

  const matchingFiles =
    allFiles.filter(
      file =>
        normalizeText(
          file.game
        ) ===
        normalizedGame
    );


  console.log(
    "================================"
  );

  console.log(
    "OPEN DOWNLOAD"
  );

  console.log(
    "GAME:",
    game.name
  );

  console.log(
    "NORMALIZED GAME:",
    normalizedGame
  );

  console.log(
    "TOTAL FILES:",
    allFiles.length
  );

  console.log(
    "MATCHING FILES:",
    matchingFiles
  );

  console.log(
    "================================"
  );


  /*
     Use Files sheet links.
  */

  let files =
    matchingFiles.filter(
      file =>
        String(
          file.link || ""
        ).trim() !== ""
    );


  /*
     FALLBACK
  */

  if (
    !files.length &&
    String(
      game.link || ""
    ).trim() !== ""
  ) {

    console.warn(
      "No Files-sheet match. Using Games-sheet link."
    );


    files = [

      {

        game:
          game.name,

        type:
          "Game",

        name:
          game.name +
          " - Game File",

        size:
          "",

        description:
          "Main game download",

        link:
          game.link

      }

    ];

  }


  fileList.innerHTML =
    "";


  if (
    !files.length
  ) {

    fileList.innerHTML = `

      <div class="no-files">

        No download files are
        currently available.

        <br><br>

        Make sure the Files sheet
        contains this game:

        <br><br>

        <strong>
          ${escapeHTML(
            game.name
          )}
        </strong>

      </div>

    `;

  }


  /*
     Render every file.
  */

  files.forEach(
    file => {

      if (
        !file.link
      ) {

        return;

      }


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "file-item";


      const type =
        escapeHTML(
          file.type ||
          "File"
        );


      const fileName =
        escapeHTML(
          file.name ||
          "Download"
        );


      const size =
        escapeHTML(
          file.size
        );


      const description =
        escapeHTML(
          file.description
        );


      const link =
        escapeHTML(
          file.link
        );


      item.innerHTML = `

        <div class="file-icon">

          ${getFileIcon(
            file.type
          )}

        </div>


        <div class="file-details">

          <div class="file-type">

            ${type}

          </div>


          <div class="file-name">

            ${fileName}

          </div>


          ${
            size
              ? `

                <div class="file-size">

                  ${size}

                </div>

              `
              : ""
          }


          ${
            description
              ? `

                <div class="file-description">

                  ${description}

                </div>

              `
              : ""
          }

        </div>


        <a
          class="file-download"
          href="${link}"
          target="_blank"
          rel="noopener noreferrer"
        >

          ${getDownloadIcon()}

          <span>
            Download
          </span>

        </a>

      `;


      fileList.appendChild(
        item
      );

    }
  );


  overlay.style.display =
    "flex";


  document.body.classList.add(
    "modal-open"
  );

}

document.addEventListener(
  "click",
  async function(e) {

    const shareButton =
      e.target.closest(
        ".share-btn"
      );


    if (
      !shareButton
    ) {

      return;

    }


    const card =
      shareButton.closest(
        ".card"
      );


    if (
      !card
    ) {

      return;

    }


    const gameName =
      card.dataset.game ||
      "Game";


    const shareUrl =
      window.location.origin +
      window.location.pathname +
      "?game=" +
      encodeURIComponent(
        gameName
      );


    const shareTitle =
      gameName +
      " - Gaming Hood Store";


    const shareText =
      "Check out " +
      gameName +
      " on Gaming Hood Store";


    if (
      navigator.share
    ) {

      try {

        await navigator.share({

          title:
            shareTitle,

          text:
            shareText,

          url:
            shareUrl

        });

      }

      catch(error) {

        if (
          error.name !==
          "AbortError"
        ) {

          console.error(
            "Share failed:",
            error
          );

        }

      }


      return;

    }


    try {

      await navigator.clipboard
        .writeText(
          shareUrl
        );


      showShareMessage(
        "Game link copied!"
      );

    }

    catch(error) {

      const textarea =
        document.createElement(
          "textarea"
        );


      textarea.value =
        shareUrl;


      textarea.style.position =
        "fixed";


      textarea.style.opacity =
        "0";


      document.body.appendChild(
        textarea
      );


      textarea.select();


      try {

        document.execCommand(
          "copy"
        );

      }

      catch(copyError) {

        console.error(
          "Copy failed:",
          copyError
        );

      }


      textarea.remove();


      showShareMessage(
        "Game link copied!"
      );

    }

  }
);


/* =========================================================
   SHARE MESSAGE
========================================================= */

function showShareMessage(
  message
) {

  const oldMessage =
    document.getElementById(
      "shareMessage"
    );


  if (
    oldMessage
  ) {

    oldMessage.remove();

  }


  const messageBox =
    document.createElement(
      "div"
    );


  messageBox.id =
    "shareMessage";


  messageBox.textContent =
    message;


  document.body.appendChild(
    messageBox
  );


  setTimeout(
    () => {

      if (
        messageBox.parentNode
      ) {

        messageBox.remove();

      }

    },
    2000
  );

}


/* =========================================================
   OPEN SHARED GAME
========================================================= */

function openSharedGame() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const sharedGame =
    params.get("game");


  if (
    !sharedGame
  ) {

    return;

  }


  const game =
    allGames.find(
      g =>
        normalizeText(
          g.name
        ) ===
        normalizeText(
          sharedGame
        )
    );


  if (
    !game
  ) {

    return;

  }


  displayGames([
    game
  ]);


  document.getElementById(
    "backHome"
  ).style.display =
    "block";


  setTimeout(
    () => {

      const firstCard =
        document.querySelector(
          ".card"
        );


      if (
        !firstCard
      ) {

        return;

      }


      firstCard.scrollIntoView({

        behavior:
          "smooth",

        block:
          "center"

      });


      firstCard.style.boxShadow =
        "0 0 0 3px #2196F3";


      setTimeout(
        () => {

          firstCard.style.boxShadow =
            "";

        },
        3000
      );

    },
    250
  );

}

function searchGames() {

          game.Platform

        normalizeText(

    );


  displayGames(
    filtered
  );


  document.getElementById(
    "backHome"
  ).style.display =
    query
      ? "block"
      : "none";

}

/* =========================================================
   CHECK DOWNLOAD DOMAIN
========================================================= */

function isDownloadLink(link) {

  if (
    !link ||
    !link.href
  ) {

    return false;

  }


  try {

    const url =
      new URL(
        link.href
      );


    const hostname =
      url.hostname
        .toLowerCase();


    return downloadDomains.some(
      domain => {

        domain =
          domain.toLowerCase();


        return (

          hostname === domain

          ||

          hostname.endsWith(
            "." + domain
          )

        );

      }
    );

  }

  catch(error) {

    return false;

  }

}


/* =========================================================
   LOAD MONETAG SCRIPT
========================================================= */

function loadMonetagAd() {

  /*
     Don't load the same
     Monetag script twice.
  */

  if (
    document.querySelector(
      'script[data-zone="' +
      monetagZone +
      '"]'
    )
  ) {

    return;

  }


  const script =
    document.createElement(
      "script"
    );


  script.dataset.zone =
    monetagZone;


  script.src =
    "https://al5sm.com/tag.min.js";


  script.async =
    true;


  (
    document.body ||
    document.documentElement
  )
    .appendChild(
      script
    );

}


/* =========================================================
   DOWNLOAD CLICK HANDLER
========================================================= */

document.addEventListener(
  "click",
  function(e) {

    /*
       Find nearest anchor.

       This works when clicking
       the download SVG as well.
    */

    const link =
      e.target.closest(
        "a"
      );


    if (
      !link ||
      !link.href
    ) {

      return;

    }


    /* =====================================================
       IGNORE NAVIGATION
    ===================================================== */

    if (
      link.closest(
        "nav, .menu, .navbar"
      )
    ) {

      return;

    }


    /* =====================================================
       IGNORE POPULAR POSTS
    ===================================================== */

    if (
      link.closest(
        ".PopularPosts, .popular-posts"
      )
    ) {

      return;

    }


    /* =====================================================
       IGNORE INTERNAL WEBSITE LINKS
    ===================================================== */

    try {

      const linkUrl =
        new URL(
          link.href
        );


      if (
        linkUrl.hostname ===
        window.location.hostname
      ) {

        return;

      }

    }

    catch(error) {

      return;

    }


    /* =====================================================
       CHECK DOWNLOAD LINK
    ===================================================== */

    if (
      !isDownloadLink(
        link
      )
    ) {

      return;

    }


    /*
       Stop normal navigation.
    */

    e.preventDefault();


    e.stopPropagation();


    /* =====================================================
       FIRST DOWNLOAD CLICK
       → MONETAG
    ===================================================== */

    if (
      firstClick
    ) {

      firstClick =
        false;


      console.log(
        "MONETAG: First download click."
      );


      console.log(
        "MONETAG: Loading zone",
        monetagZone
      );


      loadMonetagAd();


      /*
         Actual download is NOT
         opened on first click.
      */

      return;

    }


    /* =====================================================
       SECOND DOWNLOAD CLICK
       → REAL DOWNLOAD
    ===================================================== */

    console.log(
      "DOWNLOAD: Opening",
      link.href
    );


    window.open(
      link.href,
      "_blank",
      "noopener,noreferrer"
    );

  },
  true
);
