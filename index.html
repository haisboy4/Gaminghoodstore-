<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Gaming Hood Store</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
  padding: 10px;
}


/* =========================================================
   HEADING
========================================================= */

.heading {
  text-align: center;
  font-size: 26px;
  font-weight: bold;
  margin: 10px auto 5px;
  color: #2196F3;
  white-space: nowrap;
  overflow: hidden;
  width: fit-content;
  cursor: pointer;
  user-select: none;
  transition: transform 0.15s, opacity 0.15s;
}

.heading:active {
  transform: scale(0.96);
  opacity: 0.75;
}

.cursor {
  display: inline-block;
  margin-left: 2px;
  animation: blink 0.7s infinite;
}

@keyframes blink {
  50% {
    opacity: 0;
  }
}


/* =========================================================
   SEARCH
========================================================= */

.search-bar {
  position: sticky;
  top: 0;
  z-index: 100;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 10px;

  background: rgba(255,255,255,0.25);

  backdrop-filter: blur(10px);

  border-radius: 20px;

  margin-bottom: 10px;

  box-shadow:
    0 4px 15px rgba(0,0,0,0.1);
}

.search-bar input {
  width: 70%;

  padding: 10px 14px;

  font-size: 16px;

  border: none;

  border-radius: 25px 0 0 25px;

  outline: none;

  background: rgba(255,255,255,0.7);
}

.search-bar button {
  background: #2196F3;

  border: none;

  color: white;

  padding: 10px 15px;

  border-radius: 0 25px 25px 0;

  cursor: pointer;

  font-size: 18px;
}

.search-bar button:hover {
  background: #1976D2;
}


/* =========================================================
   GAME GRID
========================================================= */

.grid {
  display: grid;

  grid-template-columns:
    repeat(auto-fill, minmax(160px, 1fr));

  gap: 15px;

  margin-top: 10px;
}


/* =========================================================
   GAME CARD
========================================================= */

.card {
  background: white;

  border-radius: 10px;

  box-shadow:
    0 2px 5px rgba(0,0,0,0.2);

  overflow: hidden;

  display: flex;

  flex-direction: column;

  min-width: 0;

  transition:
    transform 0.2s,
    box-shadow 0.2s;
}

.card:hover {
  transform: translateY(-2px);

  box-shadow:
    0 5px 12px rgba(0,0,0,0.18);
}

.card img {
  width: 100%;

  height: 140px;

  object-fit: cover;

  display: block;

  background: #eee;
}

.card .info {
  padding: 10px;

  flex: 1;
}

.card h3 {
  font-size: 16px;

  margin: 0 0 8px;

  line-height: 1.25;

  word-wrap: break-word;
}

.card p {
  font-size: 13px;

  color: gray;

  margin: 0 0 10px;

  line-height: 1.4;

  word-wrap: break-word;
}


/* =========================================================
   CARD ACTIONS
========================================================= */

.card-actions {
  display: flex;

  width: 100%;
}

.card-actions .btn {
  flex: 1;

  display: flex;

  align-items: center;

  justify-content: center;

  background: #2196F3;

  color: white;

  text-align: center;

  padding: 10px;

  text-decoration: none;

  border-radius: 0;

  font-size: 16px;

  border: none;

  cursor: pointer;

  transition: background 0.2s;
}

.card-actions .btn:hover {
  background: #1976D2;
}


/* =========================================================
   SHARE
========================================================= */

.share-btn {
  flex: 0 0 52px;

  display: flex;

  align-items: center;

  justify-content: center;

  border: none;

  background: #1976D2;

  color: white;

  cursor: pointer;

  padding: 0;

  border-radius: 0 0 10px 0;
}

.share-btn:hover {
  background: #1565C0;
}

.share-btn:active {
  transform: scale(0.94);
}

.share-icon {
  width: 22px;

  height: 22px;

  fill: none;

  stroke: currentColor;

  stroke-width: 2;

  stroke-linecap: round;

  stroke-linejoin: round;
}


/* =========================================================
   BACK HOME
========================================================= */

#backHome {
  display: none;

  width: 100%;

  max-width: 360px;

  margin: 18px auto 8px;

  padding: 11px 18px;

  border: 1px solid #dceaf7;

  border-radius: 25px;

  background: rgba(255,255,255,0.75);

  backdrop-filter: blur(8px);

  color: #2196F3;

  font-size: 14px;

  font-weight: bold;

  cursor: pointer;

  box-shadow:
    0 3px 12px rgba(33,150,243,0.10);

  transition:
    background 0.2s,
    transform 0.15s,
    box-shadow 0.2s;
}

#backHome:hover {
  background: #ffffff;

  box-shadow:
    0 5px 15px rgba(33,150,243,0.15);
}

#backHome:active {
  transform: scale(0.97);
}


/* =========================================================
   DOWNLOAD OVERLAY
========================================================= */

.download-overlay {
  position: fixed;

  inset: 0;

  background: rgba(0,0,0,0.55);

  backdrop-filter: blur(5px);

  display: none;

  align-items: center;

  justify-content: center;

  padding: 15px;

  z-index: 1000;
}


/* =========================================================
   MODAL
========================================================= */

.download-modal {
  width: 100%;

  max-width: 500px;

  max-height: 85vh;

  overflow-y: auto;

  background: white;

  border-radius: 18px;

  box-shadow:
    0 15px 50px rgba(0,0,0,0.3);

  animation: modalIn 0.2s ease-out;
}

@keyframes modalIn {

  from {
    opacity: 0;

    transform:
      translateY(20px)
      scale(0.97);
  }

  to {
    opacity: 1;

    transform:
      translateY(0)
      scale(1);
  }

}


/* =========================================================
   MODAL HEADER
========================================================= */

.modal-header {
  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 18px;

  border-bottom: 1px solid #eee;
}

.modal-title-area {
  min-width: 0;

  padding-right: 10px;
}

.modal-title {
  margin: 0;

  font-size: 21px;

  color: #111;

  word-break: break-word;
}

.modal-subtitle {
  margin: 5px 0 0;

  color: #777;

  font-size: 13px;
}

.close-modal {
  width: 38px;

  height: 38px;

  border: none;

  border-radius: 50%;

  background: #f1f1f1;

  color: #444;

  cursor: pointer;

  display: flex;

  align-items: center;

  justify-content: center;

  flex-shrink: 0;
}

.close-modal:hover {
  background: #e5e5e5;
}

.close-icon {
  width: 20px;

  height: 20px;

  fill: none;

  stroke: currentColor;

  stroke-width: 2;

  stroke-linecap: round;
}


/* =========================================================
   MODAL BODY
========================================================= */

.modal-body {
  padding: 14px 15px 18px;
}


/* =========================================================
   FILE ITEM
========================================================= */

.file-item {
  display: flex;

  align-items: center;

  gap: 12px;

  padding: 13px;

  margin-bottom: 10px;

  background: #f7f9fb;

  border: 1px solid #e7ebef;

  border-radius: 12px;
}

.file-item:last-child {
  margin-bottom: 0;
}


/* =========================================================
   FILE ICON
========================================================= */

.file-icon {
  width: 42px;

  height: 42px;

  border-radius: 10px;

  background: #e8f3ff;

  color: #2196F3;

  display: flex;

  align-items: center;

  justify-content: center;

  flex-shrink: 0;
}

.file-icon svg {
  width: 22px;

  height: 22px;

  fill: none;

  stroke: currentColor;

  stroke-width: 1.8;

  stroke-linecap: round;

  stroke-linejoin: round;
}


/* =========================================================
   FILE DETAILS
========================================================= */

.file-details {
  flex: 1;

  min-width: 0;
}

.file-type {
  display: inline-block;

  font-size: 10px;

  font-weight: bold;

  text-transform: uppercase;

  color: #2196F3;

  margin-bottom: 3px;
}

.file-name {
  font-size: 15px;

  font-weight: bold;

  color: #222;

  word-break: break-word;

  line-height: 1.25;
}

.file-size {
  font-size: 12px;

  color: #777;

  margin-top: 4px;
}

.file-description {
  font-size: 12px;

  color: #555;

  margin-top: 5px;

  line-height: 1.4;

  word-break: break-word;
}


/* =========================================================
   DOWNLOAD BUTTON
========================================================= */

.file-download {
  flex-shrink: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 5px;

  border: none;

  background: #2196F3;

  color: white;

  padding: 9px 11px;

  border-radius: 8px;

  font-size: 12px;

  font-weight: bold;

  cursor: pointer;

  text-decoration: none;
}

.file-download:hover {
  background: #1976D2;
}

.download-icon {
  width: 15px;

  height: 15px;

  fill: none;

  stroke: currentColor;

  stroke-width: 2;

  stroke-linecap: round;

  stroke-linejoin: round;
}


/* =========================================================
   NO FILES
========================================================= */

.no-files {
  text-align: center;

  padding: 25px 10px;

  color: #777;

  font-size: 14px;

  line-height: 1.5;
}


/* =========================================================
   BACK TO TOP
========================================================= */

#backToTop {
  position: fixed;

  bottom: 20px;

  right: 20px;

  background: rgba(255,255,255,0.8);

  color: #2196F3;

  border: 1px solid rgba(255,255,255,0.4);

  border-radius: 50%;

  width: 48px;

  height: 48px;

  font-size: 22px;

  cursor: pointer;

  box-shadow:
    0 4px 15px rgba(0,0,0,0.2);

  backdrop-filter: blur(8px);

  display: none;

  z-index: 20;
}


/* =========================================================
   LOADER
========================================================= */

#loader {
  text-align: center;

  margin-top: 20px;
}

.spinner {
  width: 30px;

  height: 30px;

  border: 4px solid #ddd;

  border-top: 4px solid #2196F3;

  border-radius: 50%;

  margin: auto;

  animation:
    spin 1s linear infinite;
}

@keyframes spin {

  100% {
    transform: rotate(360deg);
  }

}


/* =========================================================
   RETRY
========================================================= */

#retryBtn {
  display: none;

  margin: 15px auto;

  padding: 10px 20px;

  background: #ff5252;

  color: white;

  border: none;

  border-radius: 8px;

  cursor: pointer;

  font-size: 15px;
}


/* =========================================================
   NO RESULTS
========================================================= */

.no-results {
  grid-column: 1 / -1;

  text-align: center;

  padding: 30px 10px;

  color: #777;

  font-size: 16px;
}


/* =========================================================
   SKELETON
========================================================= */

.skeleton {
  animation: shimmer 1.2s infinite;

  background:
    linear-gradient(
      90deg,
      #eee 25%,
      #ddd 50%,
      #eee 75%
    );

  background-size: 200% 100%;
}

.skeleton-img {
  height: 140px;
}

.skeleton-text {
  height: 12px;

  margin: 8px;

  border-radius: 4px;
}

@keyframes shimmer {

  0% {
    background-position: -200% 0;
  }

  100% {
    background-position: 200% 0;
  }

}


/* =========================================================
   SHARE MESSAGE
========================================================= */

#shareMessage {
  position: fixed;

  bottom: 80px;

  left: 50%;

  transform: translateX(-50%);

  background: #222;

  color: white;

  padding: 10px 18px;

  border-radius: 20px;

  font-size: 14px;

  z-index: 9999;

  box-shadow:
    0 4px 15px rgba(0,0,0,0.25);

  white-space: nowrap;
}


/* =========================================================
   BODY LOCK
========================================================= */

body.modal-open {
  overflow: hidden;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 400px) {

  body {
    padding: 8px;
  }

  .heading {
    font-size: 24px;
  }

  .grid {
    grid-template-columns:
      repeat(2, minmax(0,1fr));

    gap: 12px;
  }

  .card img {
    height: 140px;
  }

  .card h3 {
    font-size: 15px;
  }

  .card p {
    font-size: 12px;
  }

  .card-actions .btn {
    font-size: 15px;
  }

  .share-btn {
    flex: 0 0 48px;
  }

  .share-icon {
    width: 20px;
    height: 20px;
  }

  #backHome {
    max-width: 330px;
    margin-top: 16px;
  }

  .download-overlay {
    padding: 10px;
  }

  .download-modal {
    max-height: 88vh;
    border-radius: 16px;
  }

  .file-item {
    gap: 8px;
    padding: 10px;
  }

  .file-icon {
    width: 36px;
    height: 36px;
  }

  .file-download {
    padding: 8px;
    font-size: 0;
    width: 38px;
    height: 38px;
  }

  .file-download .download-icon {
    width: 18px;
    height: 18px;
  }

}

</style>

</head>


<body>

<script>

/* =========================================================
   TYPING HEADING
========================================================= */

const headingText =
  "Gaming Hood Store";

let typeIndex = 0;

let isDeleting = false;


function typeLoop() {

  const el =
    document.getElementById(
      "typingText"
    );


  if (!isDeleting) {

    el.textContent =
      headingText.substring(
        0,
        typeIndex++
      );


    if (
      typeIndex >
      headingText.length
    ) {

      isDeleting = true;

      setTimeout(
        typeLoop,
        5000
      );

      return;
    }

  }

  else {

    el.textContent =
      headingText.substring(
        0,
        typeIndex--
      );


    if (
      typeIndex < 0
    ) {

      isDeleting = false;

    }

  }


  setTimeout(
    typeLoop,
    isDeleting ? 50 : 100
  );

}


typeLoop();


/* =========================================================
   GOOGLE SHEETS
========================================================= */

const spreadsheetId =
  "1ibhg4uYopbqS7n_wFgITtRVe8IJGJnQbRfQpCdd55uE";


/*
   MAIN GAMES SHEET

   This reads the first/default
   sheet of the spreadsheet.
*/

const sheetUrl =
  "https://docs.google.com/spreadsheets/d/" +
  spreadsheetId +
  "/export?format=csv";


/*
   FILES SHEET

   IMPORTANT:
   191236659 is the GID from your
   Files tab URL.

   We use GID directly instead of
   relying on the sheet name.
*/

const filesSheetUrl =
  "https://docs.google.com/spreadsheets/d/" +
  spreadsheetId +
  "/export?format=csv&gid=191236659";


let allGames = [];

let allFiles = [];

let retries = 0;


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(csv) {

  const rows = [];

  let row = [];

  let value = "";

  let insideQuotes = false;


  for (
    let i = 0;
    i < csv.length;
    i++
  ) {

    const char =
      csv[i];

    const next =
      csv[i + 1];


    /*
       Escaped quote:
       ""
    */

    if (
      char === '"' &&
      insideQuotes &&
      next === '"'
    ) {

      value += '"';

      i++;

      continue;

    }


    /*
       Opening / closing quote.
    */

    if (
      char === '"'
    ) {

      insideQuotes =
        !insideQuotes;

      continue;

    }


    /*
       Comma outside quotes.
    */

    if (
      char === "," &&
      !insideQuotes
    ) {

      row.push(
        value.trim()
      );

      value = "";

      continue;

    }


    /*
       New line outside quotes.
    */

    if (
      (
        char === "\n" ||
        char === "\r"
      ) &&
      !insideQuotes
    ) {

      if (
        char === "\r" &&
        next === "\n"
      ) {

        i++;

      }


      row.push(
        value.trim()
      );

      value = "";


      if (
        row.some(
          cell =>
            String(
              cell ?? ""
            ).trim() !== ""
        )
      ) {

        rows.push(row);

      }


      row = [];

      continue;

    }


    value += char;

  }


  /*
     Last row.
  */

  if (
    value !== "" ||
    row.length > 0
  ) {

    row.push(
      value.trim()
    );


    if (
      row.some(
        cell =>
          String(
            cell ?? ""
          ).trim() !== ""
      )
    ) {

      rows.push(row);

    }

  }


  return rows;

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   NORMALIZE TEXT
========================================================= */

function normalizeText(value) {

  return String(
    value ?? ""
  )

    /*
       Remove UTF-8 BOM if present.
    */

    .replace(
      /^\uFEFF/,
      ""
    )

    .trim()

    .replace(
      /\s+/g,
      " "
    )

    .toLowerCase();

}


/* =========================================================
   NORMALIZE HEADER
========================================================= */

function normalizeHeader(value) {

  return normalizeText(
    value
  )

    .replace(
      /[_-]+/g,
      " "
    )

    .replace(
      /\s+/g,
      " "
    )

    .trim();

}


/* =========================================================
   FIND HEADER
========================================================= */

function findHeaderIndex(
  headers,
  possibleNames
) {

  return headers.findIndex(
    header => {

      const h =
        normalizeHeader(
          header
        );

      return possibleNames.some(
        name =>
          h ===
          normalizeHeader(name)
      );

    }
  );

}


/* =========================================================
   SKELETONS
========================================================= */

function showSkeletons() {

  const grid =
    document.getElementById(
      "grid"
    );


  grid.innerHTML = "";


  for (
    let n = 0;
    n < 6;
    n++
  ) {

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "card";


    card.innerHTML = `

      <div
        class="skeleton skeleton-img"
      ></div>

      <div class="info">

        <div
          class="skeleton skeleton-text"
        ></div>

        <div
          class="skeleton skeleton-text"
          style="width:60%;"
        ></div>

        <div
          class="skeleton skeleton-text"
          style="width:80%;"
        ></div>

      </div>

    `;


    grid.appendChild(
      card
    );

  }

}


/* =========================================================
   LOAD FILES SHEET
========================================================= */

async function loadFilesSheet() {

  console.log(
    "======================================"
  );

  console.log(
    "STARTING FILES SHEET LOAD"
  );

  console.log(
    "Files GID: 191236659"
  );

  console.log(
    "======================================"
  );


  try {

    const controller =
      new AbortController();


    const timeout =
      setTimeout(
        () => controller.abort(),
        12000
      );


    /*
       IMPORTANT:

       Direct CSV export using the
       exact GID of your Files tab.
    */

    const url =
      filesSheetUrl +
      "&cache=" +
      Date.now();


    console.log(
      "FILES CSV URL:",
      url
    );


    const response =
      await fetch(
        url,
        {
          signal:
            controller.signal,

          cache:
            "no-store"
        }
      );


    clearTimeout(
      timeout
    );


    if (!response.ok) {

      throw new Error(
        "Files sheet HTTP error: " +
        response.status
      );

    }


    const csv =
      await response.text();


    console.log(
      "FILES CSV LENGTH:",
      csv.length
    );


    console.log(
      "RAW FILES CSV:",
      csv
    );


    if (
      !csv.trim()
    ) {

      throw new Error(
        "Files sheet returned EMPTY CSV."
      );

    }


    const rows =
      parseCSV(csv);


    console.log(
      "FILES PARSED ROWS:",
      rows
    );


    if (
      !rows.length
    ) {

      throw new Error(
        "Files sheet contains no rows."
      );

    }


    /* =====================================================
       HEADERS
    ===================================================== */

    const headers =
      rows[0].map(
        header =>
          normalizeHeader(
            header
          )
      );


    console.log(
      "FILES HEADERS:",
      headers
    );


    /* =====================================================
       COLUMN DETECTION
    ===================================================== */

    const gameIndex =
      findHeaderIndex(
        headers,
        [
          "game",
          "game name",
          "gamename",
          "game title",
          "title"
        ]
      );


    const typeIndex =
      findHeaderIndex(
        headers,
        [
          "type",
          "file type",
          "filetype",
          "category"
        ]
      );


    const nameIndex =
      findHeaderIndex(
        headers,
        [
          "name",
          "file name",
          "filename",
          "file"
        ]
      );


    const sizeIndex =
      findHeaderIndex(
        headers,
        [
          "size",
          "file size"
        ]
      );


    /*
       DESCRIPTION DETECTION

       Accepts:

       Description
       description
       Description
       Info
       info
       Details
       File Description
       File Info
    */

    const descriptionIndex =
      findHeaderIndex(
        headers,
        [
          "description",
          "desc",
          "info",
          "details",
          "file description",
          "file info",
          "file details"
        ]
      );


    const linkIndex =
      findHeaderIndex(
        headers,
        [
          "link",
          "download",
          "download link",
          "download url",
          "url"
        ]
      );


    console.log(
      "======================================"
    );

    console.log(
      "FILES COLUMN DETECTION"
    );

    console.log(
      "Game column:",
      gameIndex
    );

    console.log(
      "Type column:",
      typeIndex
    );

    console.log(
      "Name column:",
      nameIndex
    );

    console.log(
      "Size column:",
      sizeIndex
    );

    console.log(
      "Description column:",
      descriptionIndex
    );

    console.log(
      "Link column:",
      linkIndex
    );

    console.log(
      "======================================"
    );


    /*
       GAME is required.
    */

    if (
      gameIndex === -1
    ) {

      console.error(
        "ERROR: GAME column was NOT FOUND."
      );

      console.error(
        "Detected headers:",
        headers
      );

      allFiles = [];

      return;

    }


    /*
       LINK is required.
    */

    if (
      linkIndex === -1
    ) {

      console.error(
        "ERROR: LINK column was NOT FOUND."
      );

      console.error(
        "Detected headers:",
        headers
      );

      allFiles = [];

      return;

    }


    /*
       Remove header row.
    */

    rows.shift();


    /*
       Clear previous files.
    */

    allFiles = [];


    /*
       Remember the most recent
       game name.

       This allows blank GAME
       cells to inherit the game
       above them.
    */

    let lastGameName = "";


    /* =====================================================
       PROCESS EVERY FILE ROW
    ===================================================== */

    rows.forEach(
      (row, index) => {

        if (
          !row
        ) {

          return;

        }


        /*
           Ignore completely
           empty rows.
        */

        const hasContent =
          row.some(
            cell =>
              String(
                cell ?? ""
              ).trim() !== ""
          );


        if (
          !hasContent
        ) {

          return;

        }


        /*
           Get explicit game name.
        */

        const explicitGameName =
          String(
            row[gameIndex] ?? ""
          )

            .replace(
              /^\uFEFF/,
              ""
            )

            .trim();


        /*
           If this row contains
           a game name, remember it.
        */

        if (
          explicitGameName !== ""
        ) {

          lastGameName =
            explicitGameName;

        }


        /*
           Ignore rows that appear
           before the first game.
        */

        if (
          !lastGameName
        ) {

          console.warn(
            "Skipping row before first game:",
            index + 2,
            row
          );

          return;

        }


        /* =================================================
           READ TYPE
        ================================================= */

        const type =
          typeIndex >= 0
            ? String(
                row[typeIndex] ?? ""
              ).trim()
            : "File";


        /* =================================================
           READ FILE NAME
        ================================================= */

        const name =
          nameIndex >= 0
            ? String(
                row[nameIndex] ?? ""
              ).trim()
            : "Download";


        /* =================================================
           READ SIZE
        ================================================= */

        const size =
          sizeIndex >= 0
            ? String(
                row[sizeIndex] ?? ""
              ).trim()
            : "";


        /* =================================================
           READ DESCRIPTION
        ================================================= */

        const description =
          descriptionIndex >= 0
            ? String(
                row[descriptionIndex] ?? ""
              ).trim()
            : "";


        /* =================================================
           READ LINK
        ================================================= */

        const link =
          linkIndex >= 0
            ? String(
                row[linkIndex] ?? ""
              ).trim()
            : "";


        /*
           Build file object.
        */

        const file = {

          game:
            lastGameName,

          type:
            type ||
            "File",

          name:
            name ||
            "Download",

          size:
            size,

          description:
            description,

          link:
            link

        };


        /*
           Only files containing
           a download link are added.
        */

        if (
          file.link
        ) {

          allFiles.push(
            file
          );

        }


        /*
           Debug each row.
        */

        console.log(
          "FILES ROW " +
          (index + 2) +
          ":",
          file
        );

      }
    );


    /* =====================================================
       FINAL RESULT
    ===================================================== */

    console.log(
      "======================================"
    );

    console.log(
      "FILES SHEET LOADED SUCCESSFULLY"
    );

    console.log(
      "TOTAL FILES:",
      allFiles.length
    );

    console.log(
      "ALL FILE DATA:",
      allFiles
    );

    console.log(
      "======================================"
    );


  }

  catch (error) {

    console.error(
      "======================================"
    );

    console.error(
      "FILES SHEET FAILED TO LOAD"
    );

    console.error(
      error
    );

    console.error(
      "======================================"
    );

    allFiles = [];

  }

}


/* =========================================================
   FETCH MAIN GAMES
========================================================= */

async function fetchData() {

  const loader =
    document.getElementById(
      "loader"
    );


  const retryBtn =
    document.getElementById(
      "retryBtn"
    );


  const loadingText =
    document.getElementById(
      "loadingText"
    );


  loader.style.display =
    "block";


  retryBtn.style.display =
    "none";


  loadingText.textContent =
    "Loading games...";


  showSkeletons();


  try {

    /* =====================================================
       LOAD MAIN GAMES SHEET
    ===================================================== */

    const controller =
      new AbortController();


    const timeout =
      setTimeout(
        () => controller.abort(),
        12000
      );


    const response =
      await fetch(
        sheetUrl +
        "&cache=" +
        Date.now(),
        {
          signal:
            controller.signal,

          cache:
            "no-store"
        }
      );


    clearTimeout(
      timeout
    );


    if (
      !response.ok
    ) {

      throw new Error(
        "Games sheet HTTP error: " +
        response.status
      );

    }


    const csv =
      await response.text();


    if (
      !csv.trim()
    ) {

      throw new Error(
        "Games sheet returned empty CSV."
      );

    }


    const rows =
      parseCSV(csv);


    if (
      !rows.length
    ) {

      throw new Error(
        "Games sheet is empty."
      );

    }


    /*
       Remove header.
    */

    rows.shift();


    /*
       Build games.
    */

    allGames =
      rows

        .filter(
          row =>
            row.length >= 4
        )

        .map(
          row => {

            return {

              name:
                String(
                  row[0] || ""
                ).trim(),

              Platform:
                String(
                  row[1] || ""
                ).trim(),

              image:
                String(
                  row[2] || ""
                ).trim(),

              link:
                String(
                  row[3] || ""
                ).trim(),

              /*
                 Main sheet column 5
                 is PASSWORD.
              */

              info:
                String(
                  row[4] || ""
                ).trim()

            };

          }
        )

        .filter(
          game =>
            game.name !== ""
        );


    console.log(
      "GAMES LOADED:",
      allGames
    );


    /* =====================================================
       LOAD FILES BEFORE DISPLAYING
    ===================================================== */

    loadingText.textContent =
      "Loading download files...";


    await loadFilesSheet();


    /* =====================================================
       FINISHED
    ===================================================== */

    retries = 0;


    loader.style.display =
      "none";


    displayGames(
      allGames
    );


    /*
       Open shared game if present.
    */

    openSharedGame();


  }

  catch (error) {

    console.error(
      "Games loading error:",
      error
    );


    retries++;


    if (
      retries < 3
    ) {

      setTimeout(
        fetchData,
        1500
      );

    }

    else {

      loader.style.display =
        "none";


      retryBtn.style.display =
        "block";


      document.getElementById(
        "grid"
      ).innerHTML = `

        <div class="no-results">

          Unable to load games.

          <br><br>

          Please check your internet
          connection and try again.

        </div>

      `;

    }

  }

}

/* =========================================================
   OPEN DOWNLOAD POPUP
========================================================= */

function openDownloadPopup(
  gameName
) {

  const game =
    allGames.find(
      g =>
        normalizeText(
          g.name
        ) ===
        normalizeText(
          gameName
        )
    );


  if (
    !game
  ) {

    return;

  }


  const overlay =
    document.getElementById(
      "downloadOverlay"
    );


  const title =
    document.getElementById(
      "modalGameTitle"
    );


  const subtitle =
    document.getElementById(
      "modalGameSubtitle"
    );


  const fileList =
    document.getElementById(
      "fileList"
    );


  title.textContent =
    game.name;


  subtitle.textContent =
    game.Platform
      ? "Platform: " +
        game.Platform
      : "Files & Downloads";


  /* =====================================================
     FIND FILES
  ===================================================== */

  const normalizedGame =
    normalizeText(
      game.name
    );


  const matchingFiles =
    allFiles.filter(
      file => {

        const fileGame =
          normalizeText(
            file.game
          );


        return (
          fileGame ===
          normalizedGame
        );

      }
    );


  console.log(
    "======================================"
  );

  console.log(
    "OPENING DOWNLOAD POPUP"
  );

  console.log(
    "Game:",
    game.name
  );

  console.log(
    "Normalized game:",
    normalizedGame
  );

  console.log(
    "Total files loaded:",
    allFiles.length
  );

  console.log(
    "Matching files:",
    matchingFiles
  );

  console.log(
    "======================================"
  );


  let files =
    matchingFiles.filter(
      file =>
        String(
          file.link || ""
        ).trim() !== ""
    );


  /* =====================================================
     FALLBACK
  ===================================================== */

  if (
    !files.length &&
    String(
      game.link || ""
    ).trim() !== ""
  ) {

    console.warn(
      "No Files-tab match found. Using main Games link."
    );


    files = [

      {

        game:
          game.name,

        type:
          "Game",

        name:
          game.name +
          " - Game File",

        size:
          "",

        description:
          "Main game download",

        link:
          game.link

      }

    ];

  }


  fileList.innerHTML =
    "";


  /* =====================================================
     NO FILES
  ===================================================== */

  if (
    !files.length
  ) {

    fileList.innerHTML = `

      <div class="no-files">

        No download files are
        currently available.

        <br><br>

        Make sure the Files sheet
        contains this game:

        <br><br>

        <strong>
          ${escapeHTML(
            game.name
          )}
        </strong>

      </div>

    `;

  }


  /* =====================================================
     RENDER FILES
  ===================================================== */

  files.forEach(
    file => {

      if (
        !file.link
      ) {

        return;

      }


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "file-item";


      const type =
        escapeHTML(
          file.type ||
          "File"
        );


      const fileName =
        escapeHTML(
          file.name ||
          "Download"
        );


      const size =
        escapeHTML(
          file.size
        );


      const description =
        escapeHTML(
          file.description
        );


      const link =
        escapeHTML(
          file.link
        );


      /*
         DEBUG:

         This lets you confirm that
         description is actually
         arriving from Google Sheets.
      */

      console.log(
        "RENDERING FILE:",
        {
          game:
            file.game,

          name:
            file.name,

          description:
            file.description,

          link:
            file.link
        }
      );


      item.innerHTML = `

        <div class="file-icon">

          ${getFileIcon(
            file.type
          )}

        </div>


        <div class="file-details">

          <div class="file-type">
            ${type}
          </div>


          <div class="file-name">
            ${fileName}
          </div>


          ${
            size

              ? `

                <div class="file-size">
                  ${size}
                </div>

              `

              : ""

          }


          ${
            description

              ? `

                <div class="file-description">
                  ${description}
                </div>

              `

              : ""

          }

        </div>


        <a
          class="file-download"
          href="${link}"
          target="_blank"
          rel="noopener noreferrer"
        >

          ${getDownloadIcon()}

          <span>
            Download
          </span>

        </a>

      `;


      fileList.appendChild(
        item
      );

    }
  );


  overlay.style.display =
    "flex";


  document.body.classList.add(
    "modal-open"
  );

}

    ) {

      try {

        await navigator.share({

          title:
            shareTitle,

          text:
            shareText,

          url:
            shareUrl

        });

      }

      catch(error) {

        if (
          error.name !==
          "AbortError"
        ) {

          console.error(
            "Share failed:",
            error
          );

        }

      }


      return;

    }


    try {

      await navigator.clipboard
        .writeText(
          shareUrl
        );


      showShareMessage(
        "Game link copied!"
      );

    }


    catch(error) {

      const textarea =
        document.createElement(
          "textarea"
        );


      textarea.value =
        shareUrl;


      textarea.style.position =
        "fixed";


      textarea.style.opacity =
        "0";


      document.body.appendChild(
        textarea
      );


      textarea.select();


      try {

        document.execCommand(
          "copy"
        );

      }

      catch(copyError) {

        console.error(
          "Copy failed:",
          copyError
        );

      }


      textarea.remove();


      showShareMessage(
        "Game link copied!"
      );

    }

  }
);


/* =========================================================
   SHARE MESSAGE
========================================================= */

function showShareMessage(
  message
) {

  const oldMessage =
    document.getElementById(
      "shareMessage"
    );


  if (
    oldMessage
  ) {

    oldMessage.remove();

  }


  const messageBox =
    document.createElement(
      "div"
    );


  messageBox.id =
    "shareMessage";


  messageBox.textContent =
    message;


  document.body.appendChild(
    messageBox
  );


  setTimeout(
    () => {

      if (
        messageBox.parentNode
      ) {

        messageBox.remove();

      }

    },
    2000
  );

}


/* =========================================================
   OPEN SHARED GAME
========================================================= */

function openSharedGame() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const sharedGame =
    params.get(
      "game"
    );


  if (
    !sharedGame
  ) {

    return;

  }


  const game =
    allGames.find(
      g =>
        normalizeText(
          g.name
        ) ===
        normalizeText(
          sharedGame
        )
    );


  if (
    !game
  ) {

    return;

  }


  displayGames([
    game
  ]);


  document.getElementById(
    "backHome"
  ).style.display =
    "block";


  setTimeout(
    () => {

      const firstCard =
        document.querySelector(
          ".card"
        );


      if (
        !firstCard
      ) {

        return;

      }


      firstCard.scrollIntoView({

        behavior:
          "smooth",

        block:
          "center"

      });


      firstCard.style.boxShadow =
        "0 0 0 3px #2196F3";


      setTimeout(
        () => {

          firstCard.style.boxShadow =
            "";

        },
        3000
      );

    },
    250
  );

}


/* =========================================================
   SEARCH
========================================================= */

document.getElementById(
  "searchBtn"
)
.addEventListener(
  "click",
  searchGames
);


document.getElementById(
  "searchInput"
)
.addEventListener(
  "input",
  searchGames
);


function searchGames() {

  const query =
    normalizeText(
      document.getElementById(
        "searchInput"
      ).value
    );


  const filtered =
    allGames.filter(
      game => {

        return (

          normalizeText(
            game.name
          ).includes(
            query
          )

          ||

          normalizeText(
            game.Platform
          ).includes(
            query
          )

          ||

          normalizeText(
            game.info
          ).includes(
            query
          )

        );

      }
    );


  displayGames(
    filtered
  );


  if (
    query !== ""
  ) {

    document.getElementById(
      "backHome"
    ).style.display =
      "block";

  }

  else {

    document.getElementById(
      "backHome"
    ).style.display =
      "none";

  }

}
