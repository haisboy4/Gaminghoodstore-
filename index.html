<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
  padding: 10px;
}


/* =========================================================
   HEADING
========================================================= */

.heading {
  text-align: center;
  font-size: 26px;
  font-weight: bold;
  margin: 10px auto 5px;
  color: #2196F3;
  white-space: nowrap;
  overflow: hidden;
  border-right: 3px solid #2196F3;
  width: fit-content;
}

.cursor {
  display: inline-block;
  margin-left: 2px;
  animation: blink 0.7s infinite;
}

@keyframes blink {
  50% {
    opacity: 0;
  }
}


/* =========================================================
   SEARCH BAR
========================================================= */

.search-bar {
  position: sticky;
  top: 0;
  z-index: 10;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 10px;

  background: rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(10px);

  border-radius: 20px;
  margin-bottom: 10px;

  box-shadow:
    0 4px 15px rgba(0, 0, 0, 0.1);
}

.search-bar input {
  width: 70%;

  padding: 10px 14px;

  font-size: 16px;

  border: none;

  border-radius: 25px 0 0 25px;

  outline: none;

  background: rgba(255, 255, 255, 0.7);
}

.search-bar button {
  background: #2196F3;

  border: none;

  color: white;

  padding: 10px 15px;

  border-radius: 0 25px 25px 0;

  cursor: pointer;

  font-size: 18px;
}

.search-bar button:hover {
  background: #1976D2;
}


/* =========================================================
   GAME GRID
========================================================= */

.grid {
  display: grid;

  grid-template-columns:
    repeat(auto-fill, minmax(160px, 1fr));

  gap: 15px;

  margin-top: 10px;
}


/* =========================================================
   GAME CARD
========================================================= */

.card {
  background: white;

  border-radius: 10px;

  box-shadow:
    0 2px 5px rgba(0, 0, 0, 0.2);

  overflow: hidden;

  display: flex;

  flex-direction: column;

  min-width: 0;

  transition:
    transform 0.2s,
    box-shadow 0.2s;
}

.card:hover {
  transform: translateY(-2px);

  box-shadow:
    0 5px 12px rgba(0, 0, 0, 0.18);
}

.card img {
  width: 100%;

  height: 140px;

  object-fit: cover;

  display: block;

  background: #eee;
}

.card .info {
  padding: 10px;

  flex: 1;
}

.card h3 {
  font-size: 16px;

  margin: 0 0 8px;

  line-height: 1.25;

  word-wrap: break-word;
}

.card p {
  font-size: 13px;

  color: gray;

  margin: 0 0 10px;

  line-height: 1.4;

  word-wrap: break-word;
}


/* =========================================================
   CARD ACTIONS
========================================================= */

.card-actions {
  display: flex;

  width: 100%;
}


/* =========================================================
   DOWNLOAD BUTTON
========================================================= */

.card-actions .btn {
  flex: 1;

  display: flex;

  align-items: center;

  justify-content: center;

  background: #2196F3;

  color: white;

  text-align: center;

  padding: 10px;

  text-decoration: none;

  border-radius: 0;

  font-size: 16px;

  border: none;

  cursor: pointer;

  transition:
    background 0.2s;
}

.card-actions .btn:hover {
  background: #1976D2;
}


/* =========================================================
   SHARE BUTTON
========================================================= */

.share-btn {
  flex: 0 0 52px;

  display: flex;

  align-items: center;

  justify-content: center;

  border: none;

  background: #1976D2;

  color: white;

  cursor: pointer;

  padding: 0;

  border-radius: 0 0 10px 0;

  transition:
    background 0.2s,
    transform 0.1s;
}

.share-btn:hover {
  background: #1565C0;
}

.share-btn:active {
  transform: scale(0.94);
}

.share-icon {
  width: 22px;

  height: 22px;

  fill: none;

  stroke: currentColor;

  stroke-width: 2;

  stroke-linecap: round;

  stroke-linejoin: round;
}


/* =========================================================
   DOWNLOAD POPUP OVERLAY
========================================================= */

.download-overlay {

  position: fixed;

  inset: 0;

  background:
    rgba(0, 0, 0, 0.55);

  backdrop-filter: blur(5px);

  display: none;

  align-items: center;

  justify-content: center;

  padding: 15px;

  z-index: 1000;
}


/* =========================================================
   DOWNLOAD MODAL
========================================================= */

.download-modal {

  width: 100%;

  max-width: 500px;

  max-height: 85vh;

  overflow-y: auto;

  background: #ffffff;

  border-radius: 18px;

  box-shadow:
    0 15px 50px rgba(0,0,0,0.3);

  animation:
    modalIn 0.2s ease-out;
}

@keyframes modalIn {

  from {
    opacity: 0;
    transform: translateY(20px) scale(0.97);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

}


/* =========================================================
   MODAL HEADER
========================================================= */

.modal-header {

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 18px 18px 12px;

  border-bottom:
    1px solid #eee;
}

.modal-title-area {

  min-width: 0;

  padding-right: 10px;
}

.modal-title {

  margin: 0;

  font-size: 21px;

  color: #111;

  word-break: break-word;
}

.modal-subtitle {

  margin: 5px 0 0;

  color: #777;

  font-size: 13px;
}

.close-modal {

  width: 38px;

  height: 38px;

  border: none;

  border-radius: 50%;

  background: #f1f1f1;

  color: #444;

  cursor: pointer;

  display: flex;

  align-items: center;

  justify-content: center;

  flex-shrink: 0;
}

.close-modal:hover {

  background: #e5e5e5;
}

.close-icon {

  width: 20px;

  height: 20px;

  fill: none;

  stroke: currentColor;

  stroke-width: 2;

  stroke-linecap: round;
}


/* =========================================================
   MODAL BODY
========================================================= */

.modal-body {

  padding: 14px 15px 18px;
}


/* =========================================================
   FILE ITEM
========================================================= */

.file-item {

  display: flex;

  align-items: center;

  gap: 12px;

  padding: 13px;

  margin-bottom: 10px;

  background: #f7f9fb;

  border: 1px solid #e7ebef;

  border-radius: 12px;
}

.file-item:last-child {

  margin-bottom: 0;
}


/* =========================================================
   FILE ICON
========================================================= */

.file-icon {

  width: 42px;

  height: 42px;

  border-radius: 10px;

  background: #e8f3ff;

  color: #2196F3;

  display: flex;

  align-items: center;

  justify-content: center;

  flex-shrink: 0;
}

.file-icon svg {

  width: 22px;

  height: 22px;

  fill: none;

  stroke: currentColor;

  stroke-width: 1.8;

  stroke-linecap: round;

  stroke-linejoin: round;
}


/* =========================================================
   FILE DETAILS
========================================================= */

.file-details {

  flex: 1;

  min-width: 0;
}

.file-type {

  display: inline-block;

  font-size: 10px;

  font-weight: bold;

  text-transform: uppercase;

  color: #2196F3;

  margin-bottom: 3px;
}

.file-name {

  font-size: 15px;

  font-weight: bold;

  color: #222;

  word-break: break-word;

  line-height: 1.25;
}

.file-size {

  font-size: 12px;

  color: #777;

  margin-top: 4px;
}

.file-description {

  font-size: 12px;

  color: #777;

  margin-top: 3px;

  line-height: 1.3;
}


/* =========================================================
   FILE DOWNLOAD BUTTON
========================================================= */

.file-download {

  flex-shrink: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 5px;

  border: none;

  background: #2196F3;

  color: white;

  padding: 9px 11px;

  border-radius: 8px;

  font-size: 12px;

  font-weight: bold;

  cursor: pointer;

  text-decoration: none;
}

.file-download:hover {

  background: #1976D2;
}

.download-icon {

  width: 15px;

  height: 15px;

  fill: none;

  stroke: currentColor;

  stroke-width: 2;

  stroke-linecap: round;

  stroke-linejoin: round;
}


/* =========================================================
   NO FILES MESSAGE
========================================================= */

.no-files {

  text-align: center;

  padding: 25px 10px;

  color: #777;

  font-size: 14px;
}


/* =========================================================
   BACK TO TOP
========================================================= */

#backToTop {

  position: fixed;

  bottom: 20px;

  right: 20px;

  background: rgba(255, 255, 255, 0.25);

  color: #2196F3;

  border: 1px solid rgba(255, 255, 255, 0.4);

  border-radius: 50%;

  width: 48px;

  height: 48px;

  font-size: 22px;

  cursor: pointer;

  box-shadow:
    0 4px 15px rgba(0, 0, 0, 0.2);

  backdrop-filter: blur(8px);

  display: none;

  z-index: 20;
}


/* =========================================================
   LOADER
========================================================= */

#loader {

  text-align: center;

  margin-top: 20px;
}

.spinner {

  width: 30px;

  height: 30px;

  border: 4px solid #ddd;

  border-top: 4px solid #2196F3;

  border-radius: 50%;

  margin: auto;

  animation:
    spin 1s linear infinite;
}

@keyframes spin {

  100% {
    transform: rotate(360deg);
  }

}


/* =========================================================
   RETRY BUTTON
========================================================= */

#retryBtn {

  display: none;

  margin: 15px auto;

  padding: 10px 20px;

  background: #ff5252;

  color: white;

  border: none;

  border-radius: 8px;

  cursor: pointer;

  font-size: 15px;
}


/* =========================================================
   NO RESULTS
========================================================= */

.no-results {

  grid-column: 1 / -1;

  text-align: center;

  padding: 30px 10px;

  color: #777;

  font-size: 16px;
}


/* =========================================================
   SKELETON
========================================================= */

.skeleton {

  animation:
    shimmer 1.2s infinite;

  background:
    linear-gradient(
      90deg,
      #eee 25%,
      #ddd 50%,
      #eee 75%
    );

  background-size: 200% 100%;
}

.skeleton-img {

  height: 140px;
}

.skeleton-text {

  height: 12px;

  margin: 8px;

  border-radius: 4px;
}

@keyframes shimmer {

  0% {
    background-position: -200% 0;
  }

  100% {
    background-position: 200% 0;
  }

}


/* =========================================================
   SHARE MESSAGE
========================================================= */

#shareMessage {

  position: fixed;

  bottom: 80px;

  left: 50%;

  transform: translateX(-50%);

  background: #222;

  color: white;

  padding: 10px 18px;

  border-radius: 20px;

  font-size: 14px;

  z-index: 9999;

  box-shadow:
    0 4px 15px rgba(0,0,0,0.25);

  white-space: nowrap;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 400px) {

  body {
    padding: 8px;

  }

  .card img {

    height: 140px;
  }

  .card h3 {

    font-size: 15px;
  }

  .card p {

    font-size: 12px;
  }

  .card-actions .btn {

    font-size: 15px;
  }

  .share-btn {

    flex: 0 0 48px;
  }

  .share-icon {

    width: 20px;

    height: 20px;
  }

  .download-overlay {

    padding: 10px;
  }

  .download-modal {

    max-height: 88vh;

    border-radius: 16px;
  }

  .file-item {

    gap: 8px;

    padding: 10px;
  }

  .file-icon {

    width: 36px;

    height: 36px;
  }

  .file-download {

    padding: 8px;

    font-size: 0;

    width: 38px;

    height: 38px;
  }

  .file-download .download-icon {

    width: 18px;

    height: 18px;
  }

}


/* =========================================================
   BODY LOCK WHEN MODAL IS OPEN
========================================================= */

body.modal-open {

  overflow: hidden;
}

</style>

  showSkeletons();


  fetch(sheetUrl)

    .then(res => {

      if (!res.ok) {

        throw new Error(
          "Failed to load CSV"
        );

      }


      return res.text();

    })


    .then(csv => {

      document.getElementById(
        "loader"
      ).style.display =
        "none";


      retries = 0;


      /* Parse CSV */

      const rows =
        parseCSV(csv);


      /* Remove header */

      if (
        rows.length > 0
      ) {

        rows.shift();

      }


      /* =====================================================
         COLUMN STRUCTURE

         A = name
         B = Platform
         C = image
         D = link
         E = info
      ===================================================== */

      allGames = rows

        .filter(
          row =>
            row.length >= 4
        )

        .map(row => {

          return {

            name:
              row[0] || "",

            Platform:
              row[1] || "",

            image:
              row[2] || "",

            link:
              row[3] || "",

            info:
              row[4] || ""

          };

        });


      console.log(
        "Games loaded:",
        allGames
      );


      displayGames(
        allGames
      );


      /* Check for a shared game */

      openSharedGame();

    })


    .catch(error => {

      console.error(
        "CSV loading error:",
        error
      );


      retries++;


      if (
        retries < 3
      ) {

        setTimeout(
          fetchData,
          1500
        );

      }

      else {

        document.getElementById(
          "loader"
        ).style.display =
          "none";


        document.getElementById(
          "retryBtn"
        ).style.display =
          "block";

      }

    });

}

/* =========================================================

========================================================= */

function displayGames(games) {

    document.getElementById(

    );


  grid.innerHTML = "";


  /* No games */

  if (
    !games.length
  ) {

    grid.innerHTML = `

      <div class="no-results">
        No games found.
      </div>

    `;

    return;

  }


  games.forEach(game => {

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "card";


    /* Safely escape text */

    const name =
      escapeHTML(
        game.name
      );


    const platform =
      escapeHTML(
        game.Platform
      );


    const info =
      escapeHTML(
        game.info
      );


    const image =
      escapeHTML(
        game.image
      );


    const link =
      escapeHTML(
        game.link
      );


    card.innerHTML = `

      <img
        src="${image}"
        alt="${name}"
        loading="lazy"
        onerror="this.style.display='none'"
      >


      <div class="info">

        <h3>
          ${name}
        </h3>


        <p>
          Platform: ${platform}
        </p>


        <p>
          Info:
          ${
            info ||
            "No information available"
          }

      </div>


      <div class="card-actions">

        <a

          target="_blank"

        <button

            ></circle>

              x2="15.42"

/* =========================================================
   GAME SHARING
========================================================= */

document.addEventListener(
  "click",
  async function(e) {

    const shareButton =
      e.target.closest(
        ".share-btn"
      );


    if (!shareButton) {

      return;

    }


    const gameName =
      shareButton.dataset.game ||
      "Game";


    /*
       Create a direct link
       to this specific game.
    */

    const shareUrl =

      window.location.origin +

      window.location.pathname +

      "?game=" +

      encodeURIComponent(
        gameName
      );


    const shareTitle =
      gameName +
      " - Gaming Hood Store";


    const shareText =
      "Check out " +
      gameName +
      " on Gaming Hood Store";


    /* =====================================================
       NATIVE SHARE
    ===================================================== */

    if (
      navigator.share
    ) {

      try {

        await navigator.share({

          title:
            shareTitle,

          text:
            shareText,

          url:
            shareUrl

        });

      }

      catch (error) {

        /*
           User cancelled the
           share menu.
        */

        if (
          error.name !==
          "AbortError"
        ) {

          console.error(
            "Share failed:",
            error
          );

        }

      }


      return;

    }


    /* =====================================================
       CLIPBOARD FALLBACK
    ===================================================== */

    try {

      await navigator.clipboard
        .writeText(
          shareUrl
        );


      showShareMessage(
        "Game link copied!"
      );

    }

    catch (error) {

      /*
         Older browser fallback.
      */

      const textarea =
        document.createElement(
          "textarea"
        );


      textarea.value =
        shareUrl;


      textarea.style.position =
        "fixed";


      textarea.style.opacity =
        "0";


      document.body.appendChild(
        textarea
      );


      textarea.select();


      document.execCommand(
        "copy"
      );


      textarea.remove();


      showShareMessage(
        "Game link copied!"
      );

    }

  }
);


/* =========================================================
   SHARE MESSAGE
========================================================= */

function showShareMessage(
  message
) {

  const oldMessage =
    document.getElementById(
      "shareMessage"
    );


  if (oldMessage) {

    oldMessage.remove();

  }


  const messageBox =
    document.createElement(
      "div"
    );


  messageBox.id =
    "shareMessage";


  messageBox.textContent =
    message;


  document.body.appendChild(
    messageBox
  );


  setTimeout(() => {

    messageBox.remove();

  }, 2000);

}


/* =========================================================
   OPEN SHARED GAME
========================================================= */

function openSharedGame() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const sharedGame =
    params.get("game");


  if (!sharedGame) {

    return;

  }


  const game =
    allGames.find(
      g =>
        g.name
          .toLowerCase()
          .trim() ===
        sharedGame
          .toLowerCase()
          .trim()
    );


  if (!game) {

    return;

  }


  /*
     Display only the
     shared game.
  */

  displayGames([
    game
  ]);


  /*
     Scroll to the game.
  */

  setTimeout(() => {

    const firstCard =
      document.querySelector(
        ".card"
      );


    if (firstCard) {

      firstCard.scrollIntoView({

        behavior:
          "smooth",

        block:
          "center"

      });


      /*
         Highlight shared game.
      */

      firstCard.style.boxShadow =
        "0 0 0 3px #2196F3";


      setTimeout(() => {

        firstCard.style.boxShadow =
          "";

      }, 3000);

    }

  }, 200);

}


/* =========================================================
   SEARCH
========================================================= */

document.getElementById(
  "searchBtn"
)
.addEventListener(
  "click",
  searchGames
);


document.getElementById(
  "searchInput"
)
.addEventListener(
  "input",
  searchGames
);


function searchGames() {

  const query =
    document.getElementById(
      "searchInput"
    )
    .value
    .toLowerCase()
    .trim();


  const filtered =
    allGames.filter(
      game => {

        return (

          game.name
            .toLowerCase()
            .includes(query)

          ||

          game.Platform
            .toLowerCase()
            .includes(query)

          ||

          game.info
            .toLowerCase()
            .includes(query)

        );

      }
    );


  displayGames(
    filtered
  );

}

========================================================= */

let firstClick = true;


const downloadDomains = [

  "drive.google.com",

  "drive.usercontent.google.com",

  "apkvision.org",

  "dl.apkvision.org",

  "mediafire.com",

  "modsfire.com",

  "mega.nz",

  "steamunlocked.org",

  "paste.fitgirl-repacks.site",

  "romsgames.net",

  "coolrom.com",

  "myrient.erista.me",

  "github.com",

  "githubusercontent.com",

  "dodi-repacks.site",

  "1fichier.com",

  "pixeldrain.com",

  "buzzheavier.com",

  "play.google.com",

  "gofile.io",

  "gamehub.xiaoji",

  "romspedia",

  "gplinks.co"

];


document.addEventListener(
  "click",
  function(e) {

    const link =
      e.target.closest(
        "a"
      );


    if (
      !link ||
      !link.href
    ) {

      return;

    }


    /* Ignore navigation */

    if (
      link.closest(
        "nav, .menu, .navbar"
      )
    ) {

      return;

    }


    /* Ignore popular posts */

    if (
      link.closest(
        ".PopularPosts, .popular-posts"
      )
    ) {

      return;

    }


    /* Check download domain */

    const isDownload =
      downloadDomains.some(
        domain =>
          link.href.includes(
            domain
          )
      );


    if (!isDownload) {

      return;

    }


    /* Stop normal navigation */

    e.preventDefault();


    /* First click loads ad */

    if (firstClick) {

      firstClick = false;


      const s =
        document.createElement(
          "script"
        );


      s.dataset.zone =
        "10369066";


      s.src =
        "https://al5sm.com/tag.min.js";


      document.body.appendChild(
        s
      );


      return;

    }


    /* Second click opens download */

    window.open(

      link.href,

      "_blank"

    );

  }
);
