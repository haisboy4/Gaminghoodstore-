<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Gaming Hood Store</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
  padding: 10px;
}


/* =========================================================
   HEADING / HOME BUTTON
========================================================= */

.heading {
  text-align: center;

  font-size: 26px;

  font-weight: bold;

  margin: 10px auto 5px;

  color: #2196F3;

  white-space: nowrap;

  overflow: hidden;

  width: fit-content;

  cursor: pointer;

  user-select: none;

  transition:
    transform 0.15s,
    opacity 0.15s;
}

.heading:active {
  transform: scale(0.96);

  opacity: 0.75;
}

.cursor {
  display: inline-block;

  margin-left: 2px;

  animation:
    blink 0.7s infinite;
}

@keyframes blink {

  50% {
    opacity: 0;
  }

}


/* =========================================================
   SEARCH BAR
========================================================= */

.search-bar {

  position: sticky;

  top: 0;

  z-index: 100;

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 10px;

  background:
    rgba(255,255,255,0.25);

  backdrop-filter:
    blur(10px);

  border-radius: 20px;

  margin-bottom: 10px;

  box-shadow:
    0 4px 15px rgba(0,0,0,0.1);
}

.search-bar input {

  width: 70%;

  padding: 10px 14px;

  font-size: 16px;

  border: none;

  border-radius:
    25px 0 0 25px;

  outline: none;

  background:
    rgba(255,255,255,0.7);
}

.search-bar button {

  background: #2196F3;

  border: none;

  color: white;

  padding: 10px 15px;

  border-radius:
    0 25px 25px 0;

  cursor: pointer;

  font-size: 18px;
}

.search-bar button:hover {

  background: #1976D2;
}


/* =========================================================
   GAME GRID
========================================================= */

.grid {

  display: grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(160px, 1fr)
    );

  gap: 15px;

  margin-top: 10px;
}


/* =========================================================
   GAME CARD
========================================================= */

.card {

  background: white;

  border-radius: 10px;

  box-shadow:
    0 2px 5px rgba(0,0,0,0.2);

  overflow: hidden;

  display: flex;

  flex-direction: column;

  min-width: 0;

  transition:
    transform 0.2s,
    box-shadow 0.2s;
}

.card:hover {

  transform:
    translateY(-2px);

  box-shadow:
    0 5px 12px rgba(0,0,0,0.18);
}

.card img {

  width: 100%;

  height: 140px;

  object-fit: cover;

  display: block;

  background: #eee;
}

.card .info {

  padding: 10px;

  flex: 1;
}

.card h3 {

  font-size: 16px;

  margin:
    0 0 8px;

  line-height: 1.25;

  word-wrap: break-word;
}

.card p {

  font-size: 13px;

  color: gray;

  margin:
    0 0 10px;

  line-height: 1.4;

  word-wrap: break-word;
}


/* =========================================================
   CARD ACTIONS
========================================================= */

.card-actions {

  display: flex;

  width: 100%;
}

.card-actions .btn {

  flex: 1;

  display: flex;

  align-items: center;

  justify-content: center;

  background: #2196F3;

  color: white;

  text-align: center;

  padding: 10px;

  text-decoration: none;

  border-radius: 0;

  font-size: 16px;

  border: none;

  cursor: pointer;

  transition:
    background 0.2s;
}

.card-actions .btn:hover {

  background: #1976D2;
}


/* =========================================================
   SHARE
========================================================= */

.share-btn {

  flex:
    0 0 52px;

  display: flex;

  align-items: center;

  justify-content: center;

  border: none;

  background: #1976D2;

  color: white;

  cursor: pointer;

  padding: 0;

  border-radius:
    0 0 10px 0;
}

.share-btn:hover {

  background: #1565C0;
}

.share-btn:active {

  transform:
    scale(0.94);
}

.share-icon {

  width: 22px;

  height: 22px;

  fill: none;

  stroke:
    currentColor;

  stroke-width: 2;

  stroke-linecap: round;

  stroke-linejoin: round;
}


/* =========================================================
   BACK TO HOME
========================================================= */

#backHome {

  display: none;

  width: 100%;

  max-width: 360px;

  margin:
    18px auto 8px;

  padding:
    11px 18px;

  border:
    1px solid #dceaf7;

  border-radius: 25px;

  background:
    rgba(255,255,255,0.75);

  backdrop-filter:
    blur(8px);

  color: #2196F3;

  font-size: 14px;

  font-weight: bold;

  cursor: pointer;

  box-shadow:
    0 3px 12px
    rgba(33,150,243,0.10);

  transition:
    background 0.2s,
    transform 0.15s,
    box-shadow 0.2s;
}

#backHome:hover {

  background: #ffffff;

  box-shadow:
    0 5px 15px
    rgba(33,150,243,0.15);
}

#backHome:active {

  transform:
    scale(0.97);
}


/* =========================================================
   DOWNLOAD OVERLAY
========================================================= */

.download-overlay {

  position: fixed;

  inset: 0;

  background:
    rgba(0,0,0,0.55);

  backdrop-filter:
    blur(5px);

  display: none;

  align-items: center;

  justify-content: center;

  padding: 15px;

  z-index: 1000;
}


/* =========================================================
   MODAL
========================================================= */

.download-modal {

  width: 100%;

  max-width: 500px;

  max-height: 85vh;

  overflow-y: auto;

  background: white;

  border-radius: 18px;

  box-shadow:
    0 15px 50px
    rgba(0,0,0,0.3);

  animation:
    modalIn 0.2s ease-out;
}

@keyframes modalIn {

  from {

    opacity: 0;

    transform:
      translateY(20px)
      scale(0.97);

  }

  to {

    opacity: 1;

    transform:
      translateY(0)
      scale(1);

  }

}


/* =========================================================
   MODAL HEADER
========================================================= */

.modal-header {

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 18px;

  border-bottom:
    1px solid #eee;
}

.modal-title-area {

  min-width: 0;

  padding-right: 10px;
}

.modal-title {

  margin: 0;

  font-size: 21px;

  color: #111;

  word-break: break-word;
}

.modal-subtitle {

  margin:
    5px 0 0;

  color: #777;

  font-size: 13px;
}

.close-modal {

  width: 38px;

  height: 38px;

  border: none;

  border-radius: 50%;

  background: #f1f1f1;

  color: #444;

  cursor: pointer;

  display: flex;

  align-items: center;

  justify-content: center;

  flex-shrink: 0;
}

.close-modal:hover {

  background: #e5e5e5;
}

.close-icon {

  width: 20px;

  height: 20px;

  fill: none;

  stroke: currentColor;

  stroke-width: 2;

  stroke-linecap: round;
}


/* =========================================================
   MODAL BODY
========================================================= */

.modal-body {

  padding:
    14px 15px 18px;
}


/* =========================================================
   FILE ITEM
========================================================= */

.file-item {

  display: flex;

  align-items: center;

  gap: 12px;

  padding: 13px;

  margin-bottom: 10px;

  background: #f7f9fb;

  border:
    1px solid #e7ebef;

  border-radius: 12px;
}

.file-item:last-child {

  margin-bottom: 0;
}


/* =========================================================
   FILE ICON
========================================================= */

.file-icon {

  width: 42px;

  height: 42px;

  border-radius: 10px;

  background: #e8f3ff;

  color: #2196F3;

  display: flex;

  align-items: center;

  justify-content: center;

  flex-shrink: 0;
}

.file-icon svg {

  width: 22px;

  height: 22px;

  fill: none;

  stroke: currentColor;

  stroke-width: 1.8;

  stroke-linecap: round;

  stroke-linejoin: round;
}


/* =========================================================
   FILE DETAILS
========================================================= */

.file-details {

  flex: 1;

  min-width: 0;
}

.file-type {

  display: inline-block;

  font-size: 10px;

  font-weight: bold;

  text-transform: uppercase;

  color: #2196F3;

  margin-bottom: 3px;
}

.file-name {

  font-size: 15px;

  font-weight: bold;

  color: #222;

  word-break: break-word;

  line-height: 1.25;
}

.file-size {

  font-size: 12px;

  color: #777;

  margin-top: 4px;
}

.file-description {

  font-size: 12px;

  color: #777;

  margin-top: 3px;

  line-height: 1.3;
}


/* =========================================================
   FILE DOWNLOAD BUTTON
========================================================= */

.file-download {

  flex-shrink: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 5px;

  border: none;

  background: #2196F3;

  color: white;

  padding:
    9px 11px;

  border-radius: 8px;

  font-size: 12px;

  font-weight: bold;

  cursor: pointer;

  text-decoration: none;
}

.file-download:hover {

  background: #1976D2;
}

.download-icon {

  width: 15px;

  height: 15px;

  fill: none;

  stroke: currentColor;

  stroke-width: 2;

  stroke-linecap: round;

  stroke-linejoin: round;
}


/* =========================================================
   NO FILES
========================================================= */

.no-files {

  text-align: center;

  padding:
    25px 10px;

  color: #777;

  font-size: 14px;

  line-height: 1.5;
}


/* =========================================================
   BACK TO TOP
========================================================= */

#backToTop {

  position: fixed;

  bottom: 20px;

  right: 20px;

  background:
    rgba(255,255,255,0.8);

  color: #2196F3;

  border:
    1px solid
    rgba(255,255,255,0.4);

  border-radius: 50%;

  width: 48px;

  height: 48px;

  font-size: 22px;

  cursor: pointer;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,0.2);

  backdrop-filter:
    blur(8px);

  display: none;

  z-index: 20;
}


/* =========================================================
   LOADER
========================================================= */

#loader {

  text-align: center;

  margin-top: 20px;
}

.spinner {

  width: 30px;

  height: 30px;

  border:
    4px solid #ddd;

  border-top:
    4px solid #2196F3;

  border-radius: 50%;

  margin: auto;

  animation:
    spin 1s linear infinite;
}

@keyframes spin {

  100% {

    transform:
      rotate(360deg);

  }

}


/* =========================================================
   RETRY
========================================================= */

#retryBtn {

  display: none;

  margin:
    15px auto;

  padding:
    10px 20px;

  background: #ff5252;

  color: white;

  border: none;

  border-radius: 8px;

  cursor: pointer;

  font-size: 15px;
}


/* =========================================================
   NO RESULTS
========================================================= */

.no-results {

  grid-column:
    1 / -1;

  text-align: center;

  padding:
    30px 10px;

  color: #777;

  font-size: 16px;
}


/* =========================================================
   SKELETON
========================================================= */

.skeleton {

  animation:
    shimmer 1.2s infinite;

  background:
    linear-gradient(
      90deg,
      #eee 25%,
      #ddd 50%,
      #eee 75%
    );

  background-size:
    200% 100%;
}

.skeleton-img {

  height: 140px;
}

.skeleton-text {

  height: 12px;

  margin: 8px;

  border-radius: 4px;
}

@keyframes shimmer {

  0% {

    background-position:
      -200% 0;

  }

  100% {

    background-position:
      200% 0;

  }

}


/* =========================================================
   SHARE MESSAGE
========================================================= */

#shareMessage {

  position: fixed;

  bottom: 80px;

  left: 50%;

  transform:
    translateX(-50%);

  background: #222;

  color: white;

  padding:
    10px 18px;

  border-radius: 20px;

  font-size: 14px;

  z-index: 9999;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,0.25);

  white-space: nowrap;
}


/* =========================================================
   BODY LOCK
========================================================= */

body.modal-open {

  overflow: hidden;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 400px) {

  body {

    padding: 8px;

  }

  .heading {

    font-size: 24px;

  }

  .grid {

    grid-template-columns:
      repeat(
        2,
        minmax(0,1fr)
      );

    gap: 12px;

  }

  .card img {

    height: 140px;

  }

  .card h3 {

    font-size: 15px;

  }

  .card p {

    font-size: 12px;

  }

  .card-actions .btn {

    font-size: 15px;

  }

  .share-btn {

    flex:
      0 0 48px;

  }

  .share-icon {

    width: 20px;

    height: 20px;

  }

  #backHome {

    max-width: 330px;

    margin-top: 16px;

  }

  .download-overlay {

    padding: 10px;

  }

  .download-modal {

    max-height: 88vh;

    border-radius: 16px;

  }

  .file-item {

    gap: 8px;

    padding: 10px;

  }

  .file-icon {

    width: 36px;

    height: 36px;

  }

  .file-download {

    padding: 8px;

    font-size: 0;

    width: 38px;

    height: 38px;

  }

  .file-download .download-icon {

    width: 18px;

    height: 18px;

  }

}

</style>

</head>


<body>


<!-- =========================================================
     CLICKABLE STORE HEADING
========================================================= -->

<div
  class="heading"
  id="homeHeading"
  role="button"
  tabindex="0"
  aria-label="Go to Gaming Hood Store home"
>

  <span id="typingText"></span>

  <span class="cursor">|</span>

</div>


<!-- =========================================================
     SEARCH
========================================================= -->

<div class="search-bar">

  <input
    type="text"
    id="searchInput"
    placeholder="Search for games..."
    autocomplete="off"
  >

  <button
    id="searchBtn"
    type="button"
    aria-label="Search"
  >

    🔍

  </button>

</div>


<!-- =========================================================
     LOADER
========================================================= -->

<div id="loader">

  <div class="spinner"></div>

  <p>Loading games...</p>

</div>


<!-- =========================================================
     RETRY
========================================================= -->

<button
  id="retryBtn"
  type="button"
>

  Retry

</button>


<!-- =========================================================
     GAME GRID
========================================================= -->

<div
  id="grid"
  class="grid"
></div>


<!-- =========================================================
     BACK TO HOME
========================================================= -->

<button
  id="backHome"
  type="button"
>

  ← Back to Home

</button>


<!-- =========================================================
     BACK TO TOP
========================================================= -->

<button
  id="backToTop"
  type="button"
  aria-label="Back to top"
>

  ↑

</button>


<!-- =========================================================
     DOWNLOAD POPUP
========================================================= -->

<div
  id="downloadOverlay"
  class="download-overlay"
>

  <div
    class="download-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalGameTitle"
  >

    <div class="modal-header">

      <div class="modal-title-area">

        <h2
          id="modalGameTitle"
          class="modal-title"
        >

          Files & Downloads

        </h2>

        <p
          id="modalGameSubtitle"
          class="modal-subtitle"
        ></p>

      </div>


      <button
        id="closeModal"
        class="close-modal"
        type="button"
        aria-label="Close"
      >

        <svg
          class="close-icon"
          viewBox="0 0 24 24"
        >

          <line
            x1="6"
            y1="6"
            x2="18"
            y2="18"
          ></line>

          <line
            x1="18"
            y1="6"
            x2="6"
            y2="18"
          ></line>

        </svg>

      </button>

    </div>


    <div
      id="fileList"
      class="modal-body"
    ></div>

  </div>

</div>


<script>


/* =========================================================
   TYPING HEADING
========================================================= */

const headingText =
  "Gaming Hood Store";

let typeIndex = 0;

let isDeleting = false;


function typeLoop() {

  const el =
    document.getElementById(
      "typingText"
    );


  if (!isDeleting) {

    el.textContent =
      headingText.substring(
        0,
        typeIndex++
      );


    if (
      typeIndex >
      headingText.length
    ) {

      isDeleting = true;


      setTimeout(
        typeLoop,
        5000
      );


      return;

    }

  }

  else {

    el.textContent =
      headingText.substring(
        0,
        typeIndex--
      );


    if (
      typeIndex < 0
    ) {

      isDeleting = false;

    }

  }


  setTimeout(

    typeLoop,

    isDeleting
      ? 50
      : 100

  );

}


typeLoop();


/* =========================================================
   GOOGLE SHEETS
========================================================= */

const spreadsheetId =
  "1ibhg4uYopbqS7n_wFgITtRVe8IJGJnQbRfQpCdd55uE";


const sheetUrl =

  "https://docs.google.com/spreadsheets/d/" +

  spreadsheetId +

  "/export?format=csv";


const filesSheetUrl =

  "https://docs.google.com/spreadsheets/d/" +

  spreadsheetId +

  "/gviz/tq?tqx=out:csv&sheet=files";


let allGames = [];

let allFiles = [];

let retries = 0;


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(csv) {

  const rows = [];

  let row = [];

  let value = "";

  let insideQuotes = false;


  for (
    let i = 0;
    i < csv.length;
    i++
  ) {

    const char =
      csv[i];

    const next =
      csv[i + 1];


    if (

      char === '"' &&

      insideQuotes &&

      next === '"'

    ) {

      value += '"';

      i++;

    }


    else if (
      char === '"'
    ) {

      insideQuotes =
        !insideQuotes;

    }


    else if (

      char === "," &&

      !insideQuotes

    ) {

      row.push(
        value.trim()
      );

      value = "";

    }


    else if (

      (
        char === "\n" ||
        char === "\r"
      ) &&

      !insideQuotes

    ) {

      if (

        char === "\r" &&
        next === "\n"

      ) {

        i++;

      }


      row.push(
        value.trim()
      );

      value = "";


      if (

        row.some(
          cell =>
            cell !== ""
        )

      ) {

        rows.push(row);

      }


      row = [];

    }


    else {

      value += char;

    }

  }


  if (

    value !== "" ||
    row.length > 0

  ) {

    row.push(
      value.trim()
    );


    if (

      row.some(
        cell =>
          cell !== ""
      )

    ) {

      rows.push(row);

    }

  }


  return rows;

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value) {

  return String(value ?? "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   NORMALIZE TEXT
========================================================= */

function normalizeText(value) {

  return String(value ?? "")

    .trim()

    .replace(
      /\s+/g,
      " "
    )

    .toLowerCase();

}


/* =========================================================
   SKELETONS
========================================================= */

function showSkeletons() {

  const grid =
    document.getElementById(
      "grid"
    );


  grid.innerHTML = "";


  for (
    let n = 0;
    n < 6;
    n++
  ) {

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "card";


    card.innerHTML = `

      <div
        class="skeleton skeleton-img"
      ></div>

      <div class="info">

        <div
          class="skeleton skeleton-text"
        ></div>

        <div
          class="skeleton skeleton-text"
          style="width:60%;"
        ></div>

        <div
          class="skeleton skeleton-text"
          style="width:80%;"
        ></div>

      </div>

    `;


    grid.appendChild(
      card
    );

  }

}


/* =========================================================
   LOAD FILES SHEET
========================================================= */

async function loadFilesSheet() {

  try {

    const controller =
      new AbortController();


    const timeout =
      setTimeout(
        () => controller.abort(),
        8000
      );


    const url =
      filesSheetUrl +
      "&cache=" +
      Date.now();


    const response =
      await fetch(

        url,

        {

          signal:
            controller.signal,

          cache:
            "no-store"

        }

      );


    clearTimeout(
      timeout
    );


    if (!response.ok) {

      throw new Error(

        "Files sheet HTTP error: " +

        response.status

      );

    }


    const csv =
      await response.text();


    const rows =
      parseCSV(csv);


    if (!rows.length) {

      allFiles = [];

      return;

    }


    /* =====================================================
       DETECT HEADERS
    ===================================================== */

    const headers =
      rows[0].map(
        header =>
          normalizeText(header)
      );


    console.log(
      "Files headers:",
      headers
    );


    const gameIndex =
      headers.findIndex(
        h =>

          h === "game" ||

          h === "game name" ||

          h === "gamename" ||

          h === "title"

      );


    const typeIndex =
      headers.findIndex(
        h =>

          h === "type" ||

          h === "file type"

      );


    const nameIndex =
      headers.findIndex(
        h =>

          h === "name" ||

          h === "file name" ||

          h === "filename"

      );


    const sizeIndex =
      headers.findIndex(
        h =>

          h === "size" ||

          h === "file size"

      );


    const descriptionIndex =
      headers.findIndex(
        h =>

          h === "description" ||

          h === "desc"

      );


    const linkIndex =
      headers.findIndex(
        h =>

          h === "link" ||

          h === "download" ||

          h === "download link" ||

          h === "url"

      );


    console.log(
      "Detected Files columns:",
      {
        gameIndex,
        typeIndex,
        nameIndex,
        sizeIndex,
        descriptionIndex,
        linkIndex
      }
    );


    /*
       Game and link headers
       must exist.
    */

    if (

      gameIndex === -1 ||

      linkIndex === -1

    ) {

      console.error(
        "Files sheet must contain game and link columns."
      );

      allFiles = [];

      return;

    }


    /*
       Remove header row.
    */

    rows.shift();


    /* =====================================================
       IMPORTANT

       A blank GAME cell inherits
       the game name from the row above.

       Example:

       WWE 2K25 | game     | Game File
                | emulator | PPSSPP
                | driver   | Vulkan
                | patch    | Update

       All four belong to WWE 2K25.
    ===================================================== */

    let lastGameName = "";


    allFiles = [];


    rows.forEach(
      row => {

        if (
          !row ||
          !row.length
        ) {

          return;

        }


        /*
           If a game name exists,
           remember it.
        */

        const currentGame =
          gameIndex >= 0
            ? String(
                row[gameIndex] || ""
              ).trim()
            : "";


        if (
          currentGame !== ""
        ) {

          lastGameName =
            currentGame;

        }


        /*
           Ignore completely
           empty rows.
        */

        const hasContent =
          row.some(
            cell =>
              String(
                cell ?? ""
              ).trim() !== ""
          );


        if (!hasContent) {

          return;

        }


        /*
           Do not create a file
           until a game name has
           been established.
        */

        if (
          !lastGameName
        ) {

          return;

        }


        const file = {

          game:
            lastGameName,

          type:
            typeIndex >= 0

              ? row[typeIndex] ||
                "File"

              : "File",

          name:
            nameIndex >= 0

              ? row[nameIndex] ||
                "Download"

              : "Download",

          size:
            sizeIndex >= 0

              ? row[sizeIndex] ||
                ""

              : "",

          description:
            descriptionIndex >= 0

              ? row[descriptionIndex] ||
                ""

              : "",

          link:
            linkIndex >= 0

              ? row[linkIndex] ||
                ""

              : ""

        };


        allFiles.push(
          file
        );

      }
    );


    console.log(
      "Files loaded:",
      allFiles
    );

  }


  catch (error) {

    console.warn(

      "Files sheet could not be loaded:",

      error

    );


    allFiles = [];

  }

}


/* =========================================================
   FETCH MAIN GAMES
========================================================= */

async function fetchData() {

  const loader =
    document.getElementById(
      "loader"
    );


  const retryBtn =
    document.getElementById(
      "retryBtn"
    );


  loader.style.display =
    "block";


  retryBtn.style.display =
    "none";


  showSkeletons();


  try {

    const controller =
      new AbortController();


    const timeout =
      setTimeout(
        () => controller.abort(),
        10000
      );


    const response =
      await fetch(

        sheetUrl +

        "&cache=" +

        Date.now(),

        {

          signal:
            controller.signal,

          cache:
            "no-store"

        }

      );


    clearTimeout(
      timeout
    );


    if (!response.ok) {

      throw new Error(

        "Games sheet HTTP error: " +

        response.status

      );

    }


    const csv =
      await response.text();


    const rows =
      parseCSV(csv);


    if (!rows.length) {

      throw new Error(
        "Games sheet is empty"
      );

    }


    rows.shift();


    allGames =
      rows

        .filter(
          row =>
            row.length >= 4
        )

        .map(
          row => {

            return {

              name:
                row[0] || "",

              Platform:
                row[1] || "",

              image:
                row[2] || "",

              link:
                row[3] || "",

              info:
                row[4] || ""

            };

          }
        );


    console.log(
      "Games loaded:",
      allGames
    );


    retries = 0;


    loader.style.display =
      "none";


    displayGames(
      allGames
    );


    /*
       Check if this URL is
       a shared game URL.
    */

    openSharedGame();


    /*
       Load additional files
       separately.
    */

    await loadFilesSheet();

  }


  catch (error) {

    console.error(
      "Games loading error:",
      error
    );


    retries++;


    if (
      retries < 3
    ) {

      setTimeout(
        fetchData,
        1500
      );

    }


    else {

      loader.style.display =
        "none";


      retryBtn.style.display =
        "block";


      document.getElementById(
        "grid"
      ).innerHTML = `

        <div class="no-results">

          Unable to load games.

          <br><br>

          Please check your internet
          connection and try again.

        </div>

      `;

    }

  }

}

/* =========================================================
   OPEN DOWNLOAD POPUP
========================================================= */

function openDownloadPopup(
  gameName
) {

  const game =
    allGames.find(
      g =>
        normalizeText(g.name) ===
        normalizeText(gameName)
    );


  if (!game) {
    return;
  }


  const overlay =
    document.getElementById(
      "downloadOverlay"
    );


  const title =
    document.getElementById(
      "modalGameTitle"
    );


  const subtitle =
    document.getElementById(
      "modalGameSubtitle"
    );


  const fileList =
    document.getElementById(
      "fileList"
    );


  title.textContent =
    game.name;


  subtitle.textContent =

    game.Platform

      ? "Platform: " +
        game.Platform

      : "Files & Downloads";


  /*
     Find ALL files belonging
     to this game.
  */

  const matchingFiles =
    allFiles.filter(
      file =>

        normalizeText(
          file.game
        ) ===

        normalizeText(
          game.name
        )
    );


  console.log(
    "Opening:",
    game.name
  );


  console.log(
    "Matching files:",
    matchingFiles
  );


  /*
     Only use files that
     actually have links.
  */

  let files =
    matchingFiles.filter(
      file =>
        String(
          file.link || ""
        ).trim() !== ""
    );


  /*
     FALLBACK

     If there is no matching
     Files sheet entry, use
     the original game link.
  */

  if (

    !files.length &&

    game.link

  ) {

    files = [

      {

        game:
          game.name,

        type:
          "Game",

        name:
          game.name +
          " - Game File",

        size:
          "",

        description:
          "Main game download",

        link:
          game.link

      }

    ];

  }


  fileList.innerHTML =
    "";


  if (
    !files.length
  ) {

    fileList.innerHTML = `

      <div class="no-files">

        No download files are
        currently available.

        <br><br>

        Make sure the Files sheet
        contains this game:

        <br><br>

        <strong>
          ${escapeHTML(
            game.name
          )}
        </strong>

      </div>

    `;

  }


  files.forEach(
    file => {

      if (!file.link) {
        return;
      }


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "file-item";


      const type =
        escapeHTML(
          file.type ||
          "File"
        );


      const fileName =
        escapeHTML(
          file.name ||
          "Download"
        );


      const size =
        escapeHTML(
          file.size
        );


      const description =
        escapeHTML(
          file.description
        );


      const link =
        escapeHTML(
          file.link
        );


      item.innerHTML = `

        <div class="file-icon">

          ${getFileIcon(
            file.type
          )}

        </div>


        <div class="file-details">

          <div class="file-type">

            ${type}

          </div>


          <div class="file-name">

            ${fileName}

          </div>


          ${
            size

              ? `

                <div class="file-size">

                  ${size}

                </div>

              `

              : ""

          }


          ${
            description

              ? `

                <div class="file-description">

                  ${description}

                </div>

              `

              : ""

          }

        </div>


        <a
          class="file-download"
          href="${link}"
          target="_blank"
          rel="noopener noreferrer"
        >

          ${getDownloadIcon()}

          <span>

            Download

          </span>

        </a>

      `;


      fileList.appendChild(
        item
      );

    }
  );


  overlay.style.display =
    "flex";


  document.body.classList.add(
    "modal-open"
  );

}

document.addEventListener(
  "click",
  async function(e) {

    const shareButton =
      e.target.closest(
        ".share-btn"
      );


    if (!shareButton) {
      return;
    }


    const card =
      shareButton.closest(
        ".card"
      );


    if (!card) {
      return;
    }


    const gameName =
      card.dataset.game ||
      "Game";


    const shareUrl =

      window.location.origin +

      window.location.pathname +

      "?game=" +

      encodeURIComponent(
        gameName
      );


    const shareTitle =

      gameName +
      " - Gaming Hood Store";


    const shareText =

      "Check out " +
      gameName +
      " on Gaming Hood Store";


    if (
      navigator.share
    ) {

      try {

        await navigator.share({

          title:
            shareTitle,

          text:
            shareText,

          url:
            shareUrl

        });

      }

      catch(error) {

        if (
          error.name !==
          "AbortError"
        ) {

          console.error(
            "Share failed:",
            error
          );

        }

      }


      return;

    }


    try {

      await navigator.clipboard
        .writeText(
          shareUrl
        );


      showShareMessage(
        "Game link copied!"
      );

    }


    catch(error) {

      const textarea =
        document.createElement(
          "textarea"
        );


      textarea.value =
        shareUrl;


      textarea.style.position =
        "fixed";


      textarea.style.opacity =
        "0";


      document.body.appendChild(
        textarea
      );


      textarea.select();


      try {

        document.execCommand(
          "copy"
        );

      }

      catch(copyError) {

        console.error(
          "Copy failed:",
          copyError
        );

      }


      textarea.remove();


      showShareMessage(
        "Game link copied!"
      );

    }

  }
);

function showShareMessage(
  message
) {

  const oldMessage =
    document.getElementById(
      "shareMessage"

  if (oldMessage) {

    oldMessage.remove();

  }


  const messageBox =
    document.createElement(
      "div"
    );


  messageBox.id =
    "shareMessage";


  messageBox.textContent =
    message;


  document.body.appendChild(
    messageBox
  );


  setTimeout(
    () => {

      if (
        messageBox.parentNode
      ) {

        messageBox.remove();

      }

    },
    2000
  );

}

  const game =
